# gitleaks configuration for m3c-tools
# https://github.com/gitleaks/gitleaks

title = "m3c-tools secret scanning"

[extend]
  useDefault = true

# Custom rules for project-specific secrets

# ER1 API key, legacy form: a bare UUID. A UUID alone is not a secret, so this
# rule needs a key name on the same line (ER1, api_key, API_KEY, apikey or
# X-API-KEY, in any case) and the UUID at most 40 characters after it. That
# covers env files (ER1_API_KEY=...), Go and JSON maps ("ER1_API_KEY": "..."),
# HTTP headers (X-API-KEY: ...) and YAML (api_key: ...). It does not see a UUID
# on a line without a key name, nor one further than 40 characters from it.
[[rules]]
  id = "er1-api-key-legacy"
  description = "ER1 API key, legacy form (a UUID next to an API key name)"
  regex = '''(?i)(?:\ber1|api[_.-]?key)[^\n]{0,40}?\b([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})\b'''
  secretGroup = 1
  keywords = ["er1", "api"]
  tags = ["key", "er1"]

  # The one exception: the obvious dummy in the profile doctor test, all zeros
  # except the version and variant digits. It is written with counted repeats
  # so that this file holds no UUID literal. gitleaks never scans its own
  # configuration file, so scripts/gitleaks-rules.test.sh checks that directly.
  [[rules.allowlists]]
    description = "Obvious dummy key in a test fixture; not a credential"
    condition = "AND"
    paths = ["^pkg/config/doctor_test\\.go$"]
    regexes = ["^0{8}-0{4}-4000-8000-0{12}$"]

# ER1 API key, prefixed form (SPEC-0438 section 5): "m3cer1_" followed by at
# least 32 random bytes in a URL-safe encoding, that is at least 43 characters
# of [A-Za-z0-9_-]. A shorter run after the prefix does not match.
[[rules]]
  id = "er1-api-key-prefixed"
  description = "ER1 API key, prefixed form"
  regex = '''\b(m3cer1_[A-Za-z0-9_-]{43,})'''
  secretGroup = 1
  keywords = ["m3cer1_"]
  tags = ["key", "er1"]

[[rules]]
  id = "plaud-token"
  description = "Plaud auth token (long alphanumeric)"
  regex = '''tokenstr.*[A-Za-z0-9]{40,}'''
  tags = ["token", "plaud"]

