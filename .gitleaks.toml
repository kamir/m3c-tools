# gitleaks configuration for m3c-tools
# https://github.com/gitleaks/gitleaks

title = "m3c-tools secret scanning"

[extend]
  useDefault = true

# Custom rules for project-specific secrets
[[rules]]
  id = "er1-api-key"
  description = "ER1 API Key (UUID format)"
  regex = '''ER1_API_KEY\s*=\s*[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}'''
  tags = ["key", "er1"]

[[rules]]
  id = "plaud-token"
  description = "Plaud auth token (long alphanumeric)"
  regex = '''tokenstr.*[A-Za-z0-9]{40,}'''
  tags = ["token", "plaud"]

# Exact synthetic fixtures only. Each exception requires both its file and value.

[[rules]]
  id = "generic-api-key"

  [[rules.allowlists]]
    description = "Synthetic test input used to exercise credential handling or redaction"
    condition = "AND"
    paths = ["^cmd/m3c\\-tools/doctor_test\\.go$"]
    regexes = [
      "^test-api-key-1234$",
    ]

  [[rules.allowlists]]
    description = "Synthetic test input used to exercise credential handling or redaction"
    condition = "AND"
    paths = ["^cmd/skillctl/trustfreeze_hardening_test\\.go$"]
    regexes = [
