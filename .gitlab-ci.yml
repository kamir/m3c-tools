# .gitlab-ci.yml — Native GitLab CI/CD Pipeline for m3c-tools & skillctl
# Supports local GitLab instances (Master2 192.168.0.135) and enterprise self-hosted/SaaS setups.

stages:
  - lint
  - test
  - build
  - release

variables:
  GO_VERSION: "1.26"
  CGO_ENABLED: "0"
  GOPATH: "$CI_PROJECT_DIR/.go"

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .go/pkg/mod/

default:
  image: golang:1.26-bookworm

# -----------------------------------------------------------------------------
# Stage: Lint
# -----------------------------------------------------------------------------
lint-and-vet:
  stage: lint
  script:
    - go vet ./...
    - |
      if command -v golangci-lint >/dev/null 2>&1; then
        golangci-lint run --timeout=5m
      else
        echo "Installing golangci-lint..."
        go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
        $GOPATH/bin/golangci-lint run --timeout=5m
      fi

# -----------------------------------------------------------------------------
# Stage: Test
# -----------------------------------------------------------------------------
unit-tests:
  stage: test
  script:
    - go test -race -count=1 ./pkg/... ./cmd/skillctl/... ./cmd/skillctl-demo/...

# -----------------------------------------------------------------------------
# Stage: Build
# -----------------------------------------------------------------------------
build-binaries:
  stage: build
  script:
    - mkdir -p dist
    - GIT_VERSION="${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}"
    - BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
    - LDFLAGS="-s -w -X main.version=${GIT_VERSION} -X main.commit=${CI_COMMIT_SHORT_SHA} -X main.date=${BUILD_DATE}"
    
    # 1. skillctl (5-arch matrix)
    - GOOS=linux GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/skillctl-linux-amd64 ./cmd/skillctl
    - GOOS=linux GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/skillctl-linux-arm64 ./cmd/skillctl
    - GOOS=darwin GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/skillctl-darwin-arm64 ./cmd/skillctl
    - GOOS=darwin GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/skillctl-darwin-amd64 ./cmd/skillctl
    - GOOS=windows GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/skillctl-windows-amd64.exe ./cmd/skillctl

    # 2. skillctl-demo (offline training / demo CLI)
    - GOOS=linux GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/skillctl-demo-linux-amd64 ./cmd/skillctl-demo
    - GOOS=darwin GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/skillctl-demo-darwin-arm64 ./cmd/skillctl-demo
    - GOOS=windows GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/skillctl-demo-windows-amd64.exe ./cmd/skillctl-demo

    # 3. m3c-tools CLI (Linux & Windows pure Go)
    - GOOS=linux GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/m3c-tools-linux-amd64 ./cmd/m3c-tools
    - GOOS=windows GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/m3c-tools-windows-amd64.exe ./cmd/m3c-tools

    # 4. thinking-engine
    - GOOS=linux GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/thinking-engine-linux-amd64 ./cmd/thinking-engine

    # Copy installer and generate checksums
    - cp tools/gitlab-install.sh dist/install.sh 2>/dev/null || cp tools/skillctl-install.sh dist/install.sh
    - cd dist && sha256sum * > SHA256SUMS
  artifacts:
    name: "m3c-artifacts-${CI_COMMIT_REF_SLUG}"
    expire_in: 30 days
    paths:
      - dist/

# -----------------------------------------------------------------------------
# Stage: Release (GitLab Generic Package Registry & Release)
# -----------------------------------------------------------------------------
gitlab-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Uploading release artifacts for ${CI_COMMIT_TAG} to GitLab Package Registry..."
    - |
      PACKAGE_NAME="m3c-tools"
      if [[ "${CI_COMMIT_TAG}" == skillctl/* ]]; then
        PACKAGE_NAME="skillctl"
      fi
      
      for file in dist/*; do
        filename=$(basename "$file")
        echo "Uploading $filename..."
        curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
             --upload-file "${file}" \
             "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${CI_COMMIT_TAG}/${filename}"
      done
  release:
    name: 'Release $CI_COMMIT_TAG'
    description: 'Release $CI_COMMIT_TAG built by GitLab CI on $CI_SERVER_HOST'
    tag_name: '$CI_COMMIT_TAG'
    ref: '$CI_COMMIT_TAG'
    assets:
      links:
        - name: 'SHA256SUMS'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/m3c-tools/${CI_COMMIT_TAG}/SHA256SUMS'
        - name: 'skillctl (Linux amd64)'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/m3c-tools/${CI_COMMIT_TAG}/skillctl-linux-amd64'
        - name: 'skillctl (macOS Apple Silicon)'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/m3c-tools/${CI_COMMIT_TAG}/skillctl-darwin-arm64'
        - name: 'skillctl (Windows amd64)'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/m3c-tools/${CI_COMMIT_TAG}/skillctl-windows-amd64.exe'
        - name: 'm3c-tools (Linux amd64)'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/m3c-tools/${CI_COMMIT_TAG}/m3c-tools-linux-amd64'
