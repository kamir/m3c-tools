# SPEC-0251 §5 supply-chain hygiene: automated dependency + action updates.
# Dependabot opens PRs only (never merges); each PR is validated by the same CI
# hardened in this change (lint, unit, skillctl-race, govulncheck, gitleaks).
version: 2
updates:
  # Go module dependencies (module mode, no vendor dir).
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "05:30"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    groups:
      # Collapse routine minor+patch bumps into one PR to cut noise; majors
      # still open individually so they get a deliberate review.
      go-minor-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions used by the workflows (checkout, setup-go, gh-release, …).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "05:30"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    groups:
      # Same pattern as gomod and pip: routine minor+patch action bumps land
      # as ONE PR per wave (decision 2026-09-17, after a five-PR wave competed
      # with feature work for the macOS runners). Majors still open
      # individually; an action major can change inputs or behavior and gets
      # a deliberate review (see #330, attest-build-provenance).
      actions-minor-patch:
        update-types: ["minor", "patch"]

  # Python for the RAG/MCP server. Its requirements.txt was unpinned, which made
  # it invisible here: with no version there is nothing to compare against, so
  # no bump and no CVE match. It is pinned now, so this entry has something to
  # work on.
  - package-ecosystem: "pip"
    directory: "/rag-mcp-server"
    schedule:
      interval: "monthly"
      time: "05:30"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
    # OWNER DECISION E3 of 2026-09-08: the two Python MAJOR bumps stay parked.
    # PR #251 raises sentence-transformers 5.5.1 to 6.0.1 and PR #252 raises
    # turbovec 0.8.0 to 1.0.0 (`grep -nE 'turbovec|sentence-transformers'
    # rag-mcp-server/requirements.txt` gives the current pins), so both are
    # major, and both feed the RAG embedder and vector index.
    #
    # WHY THIS ENTRY EXISTS AND NOT ONLY THE `hold` LABEL. The label lives on a
    # pull request object. Dependabot replaces a PR when a newer version of the
    # same package appears: the old one is closed, a new one opened, and the new
    # one carries only the labels Dependabot assigns. Measured 2026-09-08
    # 06:21Z across the eight open bot PRs carrying no `hold`, that is exactly
    # `dependencies` plus one ecosystem label, three distinct sets across the
    # eight, and never `hold`. The successor would therefore fall straight under
    # owner decision E2 and merge itself. E3 is about the PACKAGE, so it is
    # written here, where Dependabot reads it, and it survives the PR it was
    # decided on. The label stays as the short-term brake for anything else.
    #
    # SCOPE: majors only. Security and routine minor/patch updates for both
    # packages keep flowing through the group above; parking a package outright
    # is how a dependency quietly rots.
    #
    # EXPECTED SIDE EFFECT, not measured because it needs Dependabot's next run:
    # an ignored update makes Dependabot close the matching open PR, so #251 and
    # #252 will probably close on their own. That is the postponement taking
    # effect, not a loss. Lift it by deleting the entry for that package.
    ignore:
      - dependency-name: "sentence-transformers"
        update-types: ["version-update:semver-major"]
      - dependency-name: "turbovec"
        update-types: ["version-update:semver-major"]
      # Decision 2026-09-17, same E3 mechanics: the mcp MAJOR line stays parked.
      # Measured on PR #250 (run 34411243488): mcp 2.x removes
      # mcp.server.fastmcp, which mcp-skill-server imports, and the Python
      # check names its own remedy, `pip install 'mcp<2'`. Lifting this entry
      # means doing the 2.x migration of both Python servers first, then
      # deleting the line; minors and patches keep flowing through the group.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]

  # Container base images. Both Dockerfiles are DIGEST-PINNED, which is the
  # right default and also the reason they need Dependabot: a digest is
  # immutable, so an unwatched digest pin never moves, not even for a critical
  # base-image CVE. Dependabot keeps the tag and proposes the new digest.
  # Dependabot's docker ecosystem is per directory, so one entry each.
  - package-ecosystem: "docker"
    directory: "/deploy/skillctl"
    schedule:
      interval: "monthly"
      time: "05:30"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 3

  - package-ecosystem: "docker"
    directory: "/deploy/thinking-engine"
    schedule:
      interval: "monthly"
      time: "05:30"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 3
