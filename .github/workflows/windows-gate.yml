name: Windows Gate

# SPEC-0128: Windows Dev Test Cycle
# Validates Windows binary correctness on every push and PR.
# Runs on the real windows-latest runner, not emulated.
#
# ── OPT-OUT CONTRACT (the trust-layer test surface) ───────────────────────────
# The `windows-trust` job below runs the WHOLE trust-layer test surface on
# windows-latest:
#
#     ./pkg/httpsafe/...  ./pkg/skillctl/...  ./pkg/skillbundle/...  ./cmd/skillctl/...  ./evaluation/...
#
# It runs them WHOLE-PACKAGE. There is NO `-run "TestA|TestB|…"` allow-list.
# That is the durability guarantee: every trust test we ship (today and forever)
# is run on Windows automatically, with no list for anyone to maintain.
#
# The ONLY tests excluded from the Windows run are ones that SELF-SKIP because a
# real external dependency is absent: a live ER1 server, the whisper binary,
# real network egress, a microphone, or the Plaud cloud API. Those gate on the
# shared pkg/testutil.Require* helpers (env-keyed off M3C_TEST_*), which the
# windows-trust job deliberately leaves unset, so they t.Skip cleanly on every
# platform with a clear reason. Genuinely platform-incompatible code
# (recorder/PortAudio, menubar/menuet, the macOS app bundle) is build-tagged out
# and never reaches this job.
#
# DO NOT reintroduce a `-run` allow-list into the windows-trust job. The
# `drift-guard` job below FAILS the build if one ever appears. New trust tests
# are covered automatically: add them and they run on Windows. If a new test
# genuinely needs an external service, gate it with a pkg/testutil.Require*
# helper (or add one), never by excluding it in CI.

on:
  push:
    branches: [main, master]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/windows-gate.yml"
      - "scripts/test-gate-windows.sh"
  # Stacked review branches need the same native checks before reaching master.
  pull_request:

# Concurrency: one run per ref, and a superseded pull-request run is cancelled.
# The group carries a LITERAL prefix rather than ${{ github.workflow }}, because
# inside a reusable workflow that context holds the CALLER's name: a group built
# from it can collide with the caller's own group, and a called workflow waiting
# on its caller never starts. A literal cannot do that, in any file.
#
# cancel-in-progress is conditional on purpose. A superseded pull-request run
# measures a commit nobody will merge, so cancelling it costs nothing. A run on
# main or master is the record for that commit, and cancelling it would leave a
# merged commit with no evidence that this gate ever passed on it.
concurrency:
  group: windows-gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# CD-T6: least-privilege default GITHUB_TOKEN for the whole workflow.
permissions:
  contents: read

jobs:
  # ── Phase 1+2: Cross-compile check (fast, ubuntu runner) ──────────────────
  windows-compile:
    name: Windows Cross-Compile (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet (all packages)
        run: go vet ./...

      - name: Cross-compile m3c-tools.exe
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -ldflags="-s -w" -o build/m3c-tools-windows-amd64.exe ./cmd/m3c-tools

      - name: Cross-compile skillctl.exe
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -ldflags="-s -w" -o build/skillctl-windows-amd64.exe ./cmd/skillctl

      - name: Verify tray package compiles for Windows
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./pkg/tray/...

      - name: Verify config package compiles for Windows
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./pkg/config/...

      # The whole trust surface must TEST-COMPILE for windows/amd64 on every
      # change: a fast ubuntu-side guard so a Windows-incompatible test is
      # caught before the windows-latest job even starts.
      - name: Test-compile the whole trust surface for Windows
        run: |
          set -e
          for pkg in $(go list ./pkg/httpsafe/... ./pkg/skillctl/... ./pkg/skillbundle/... ./cmd/skillctl/... ./evaluation/... ./pkg/testutil/...); do
            GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go test -c -o /dev/null "$pkg"
          done
          echo "All trust-surface packages test-compile for windows/amd64."

      - name: Check binary sizes (sanity)
        run: |
          ls -lh build/m3c-tools-windows-amd64.exe
          ls -lh build/skillctl-windows-amd64.exe
          # Fail if exe is suspiciously small (< 1 MB = something went wrong)
          SIZE=$(stat -c%s build/m3c-tools-windows-amd64.exe)
          if [ "$SIZE" -lt 1048576 ]; then
            echo "ERROR: m3c-tools.exe is only ${SIZE} bytes, build may be incomplete"
            exit 1
          fi
          echo "m3c-tools.exe: ${SIZE} bytes OK"

      - name: Upload Windows binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-binaries-${{ github.sha }}
          retention-days: 7
          path: |
            build/m3c-tools-windows-amd64.exe
            build/skillctl-windows-amd64.exe

  # ── Phase 3: Whole trust surface on the real Windows runner (OPT-OUT) ──────
  # This is the durable guarantee. It runs ./pkg/httpsafe/... ./pkg/skillctl/... ./pkg/skillbundle/... ./cmd/skillctl/...
  # ./evaluation/... WHOLE-PACKAGE, env-clean. No -run allow-list: see the
  # OPT-OUT CONTRACT at the top of this file. External-service tests self-skip
  # because M3C_TEST_* are unset; platform-incompatible code is build-tagged out.
  windows-trust:
    name: Trust Surface (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        id: dependency-python
        with:
          python-version: "3.14.9"

      - name: Provision dependency fixture Python
        run: |
          & "${{ steps.dependency-python.outputs.python-path }}" scripts/setup-dependency-python.py --directory "${{ runner.temp }}/dependency-python"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Provision native MCP fixture Python
        run: |
          & "${{ steps.dependency-python.outputs.python-path }}" scripts/setup-native-mcp-python.py --directory "${{ runner.temp }}/native-mcp-python"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Native MCP process and lifecycle unit contracts
        run: |
          & "${{ steps.dependency-python.outputs.python-path }}" scripts/setup-native-mcp-python.py --run-tests "${{ github.workspace }}/win-native-mcp.xml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: go vet (Windows)
        run: go vet ./...

      - name: Configuration and secret checks (Windows)
        run: go test -count=1 -timeout=300s ./pkg/config ./pkg/er1 ./cmd/secretctl

      - name: Run the WHOLE trust surface (opt-out, env-clean)
        # NOTE: no -run filter: this is intentional and enforced by drift-guard.
        # -json preserves full test identities; tee keeps a
        # human-readable copy in the log.
        # -tags allow_home_override_test (WIN-T8): on Windows a shipping build
        # ignores $HOME for the trust-root/token-key paths; the tag re-enables the
        # $HOME injection the hermetic trust tests rely on. It flips a const, not a
        # test set. The Linux parity run needs no tag: non-Windows honors $HOME.
        run: |
          go test -tags allow_home_override_test -json -count=1 -timeout=300s `
            ./pkg/httpsafe/... ./pkg/skillctl/... ./pkg/skillbundle/... ./cmd/skillctl/... ./evaluation/... `
            | Tee-Object -FilePath win-trust.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh

      - name: Bind Windows parity evidence
        run: python scripts/windows-trust-parity.py record win-trust.json --platform windows
        shell: pwsh

      - name: Summarise run (pass / skip / fail counts)
        if: always()
        run: |
          $pass = (Select-String -Path win-trust.json -Pattern '"Action":"pass"').Count
          $skip = (Select-String -Path win-trust.json -Pattern '"Action":"skip"').Count
          $fail = (Select-String -Path win-trust.json -Pattern '"Action":"fail"').Count
          Write-Host "Windows trust surface: pass=$pass skip=$skip fail=$fail"
        shell: pwsh

      - name: Upload Windows test report (for drift parity)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: win-trust-json-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            win-trust.json
            win-trust.json.meta.json
            win-native-mcp.xml
            win-native-mcp.xml.meta.json

  # ── Drift guard (the "forever") ───────────────────────────────────────────
  # Linux test success and Windows execution parity are both required here.
  # Two additional checks keep the opt-out contract honest:
  #   1. grep guard: fail if a `-run` allow-list ever reappears in the
  #      windows-trust job. This is the primary guard: it makes the only way to
  #      hide a trust test from Windows be a self-skip, not a CI exclusion.
  #   2. parity check: a Linux run of the SAME package set, compared to the
  #      Windows run by required successful package/test/subtest identities.
  #      Skips and absent required cases fail unless narrowly excepted.
  drift-guard:
    name: Drift Guard (opt-out parity)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: windows-trust
    env:
      M3C_TOKEN_STORE: file
      M3C_TEST_KEYCHAIN: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        id: dependency-python
        with:
          python-version: "3.14.9"

      - name: Provision dependency fixture Python
        run: |
          "${{ steps.dependency-python.outputs.python-path }}" scripts/setup-dependency-python.py --directory "${{ runner.temp }}/dependency-python"

      - name: Provision native MCP fixture Python
        run: |
          "${{ steps.dependency-python.outputs.python-path }}" scripts/setup-native-mcp-python.py --directory "${{ runner.temp }}/native-mcp-python"

      - name: Native MCP process and lifecycle unit contracts
        run: |
          "${{ steps.dependency-python.outputs.python-path }}" scripts/setup-native-mcp-python.py --run-tests "${{ github.workspace }}/lin-native-mcp.xml"

      # (1) No -run allow-list may exist inside the windows-trust job.
      #     We isolate the windows-trust job block, drop comment lines (so the
      #     "# NOTE: no -run filter" comment never trips the guard), and fail if
      #     any remaining `go test` line carries a -run flag.
      - name: "Guard: windows-trust job must not use a -run allow-list"
        run: |
          set -e
          block="$(awk '/^  windows-trust:/{f=1} /^  [a-z].*:$/{if(f && $0 !~ /windows-trust/) f=0} f' \
                   .github/workflows/windows-gate.yml)"
          # Keep only non-comment lines that invoke `go test`, then look for -run.
          if printf '%s\n' "$block" \
               | sed 's/#.*$//' \
               | grep -E 'go[[:space:]]+test' \
               | grep -Eq -- '-run([[:space:]"=]|$)'; then
            echo "::error::A -run allow-list was reintroduced into the windows-trust job."
            echo "The trust surface must run whole-package on Windows (opt-out contract)."
            echo "Gate external-service tests with pkg/testutil.Require* instead."
            exit 1
          fi
          echo "OK: windows-trust runs whole-package, no -run allow-list."

      - name: Configuration and secret checks (Linux)
        run: go test -count=1 -timeout=300s ./pkg/config ./pkg/er1 ./cmd/secretctl

      # (2) Parity: require the reviewed portable identities on both platforms.
      - name: Linux run of the same trust set (-json)
        shell: bash
        run: |
          set -euo pipefail
          export GOPATH="$(go env GOPATH)"
          export GOMODCACHE="$(go env GOMODCACHE)"
          export GOCACHE="$(go env GOCACHE)"
          trust_home="$(mktemp -d)"
          export HOME="$trust_home" USERPROFILE="$trust_home"
          go test -json -count=1 -timeout=300s \
            ./pkg/httpsafe/... ./pkg/skillctl/... ./pkg/skillbundle/... ./cmd/skillctl/... ./evaluation/... \
            | tee lin-trust.json

      - name: Bind Linux parity evidence
        run: python3 scripts/windows-trust-parity.py record lin-trust.json --platform linux

      - name: Download Windows test report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: win-trust-json-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: "Parity: required successful identities with current run binding"
        run: |
          python3 scripts/windows-trust-parity.py lin-trust.json win-trust.json

      - name: Upload Linux parity evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lin-trust-json-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            lin-trust.json
            lin-trust.json.meta.json
            lin-native-mcp.xml
            lin-native-mcp.xml.meta.json

  # ── Phase 4: Smoke test the Windows binary on Windows ─────────────────────
  windows-smoke:
    name: Binary Smoke Test (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 20
    needs: windows-compile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Windows binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-binaries-${{ github.sha }}
          path: build/

      - name: Smoke, m3c-tools help
        run: |
          $out = & "build\m3c-tools-windows-amd64.exe" help 2>&1
          Write-Host $out
          if (-not ($out -match "m3c-tools")) {
            Write-Error "help output missing expected content"
            exit 1
          }
          Write-Host "PASS: help output OK"
        shell: pwsh

      - name: "Smoke: m3c-tools unknown command exits non-zero"
        run: |
          $proc = Start-Process -FilePath "build\m3c-tools-windows-amd64.exe" `
            -ArgumentList "unknown-command-xyz" `
            -PassThru -Wait -NoNewWindow
          if ($proc.ExitCode -eq 0) {
            Write-Error "Expected non-zero exit for unknown command"
            exit 1
          }
          Write-Host "PASS: unknown command exits with code $($proc.ExitCode)"
        shell: pwsh

      - name: "Smoke: skillctl help (trust CLI runs on Windows)"
        run: |
          $out = & "build\skillctl-windows-amd64.exe" --help 2>&1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host $out
          if (-not ($out -match "skillctl")) {
            Write-Error "skillctl help output is missing"
            exit 1
          }
          Write-Host "PASS: skillctl binary executes on Windows"
        shell: pwsh

      - name: "Smoke: fresh m3c-tools build and CLI help"
        run: |
          # Build a fresh binary for this smoke test
          go build -o build\m3c-tools-test.exe .\cmd\m3c-tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $out = & "build\m3c-tools-test.exe" help 2>&1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not ($out -match "m3c-tools")) {
            Write-Error "Binary does not appear to be m3c-tools"
            exit 1
          }
          Write-Host "PASS: fresh Windows build executable OK"
        shell: pwsh
