name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# CD-T6: least-privilege default GITHUB_TOKEN for the whole workflow.
permissions:
  contents: read

jobs:
  lint:
    name: Lint & Vet
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.6"

      - name: Install PortAudio
        run: brew install portaudio

      - name: Go vet
        run: go vet ./...

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      - name: golangci-lint
        run: golangci-lint run --timeout=5m

  prose-gate:
    name: Prose (no em dash)
    # Pure shell over the tracked tree: no Go toolchain, no cgo, cheap runner.
    # The rule and its two exemptions are in CODESTYLE.md ("Prose: no em dashes").
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: No U+2014 EM DASH in the tracked tree
        run: ./scripts/check-no-emdash.sh

      # A workflow file that does not PARSE never runs, so no guard living
      # inside .github/workflows can catch its own file being broken. This step
      # lives in ci.yml and parses its siblings, which is the only arrangement
      # that works. It exists because a punctuation sweep once turned seven step
      # names into `name: Guard: ...`, invalid YAML, and pin-guard.yml plus
      # windows-gate.yml silently stopped running for four merges.
      - name: Every workflow file is valid YAML
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          files = sorted(glob.glob(".github/workflows/*.yml") + glob.glob(".github/workflows/*.yaml"))
          if not files:
              sys.exit("no workflow files found: the glob is wrong, not the tree")
          bad = 0
          for f in files:
              try:
                  yaml.safe_load(open(f, encoding="utf-8"))
              except Exception as e:
                  print(f"INVALID {f}: {str(e).splitlines()[0]}")
                  bad += 1
          print(f"{len(files)} workflow files checked, {bad} invalid")
          if bad:
              print("An unquoted colon in a step name is the usual cause: "
                    'name: Foo: bar  ->  name: "Foo: bar"')
              sys.exit(1)
          PY

  docs-gate:
    name: CLI/manual consistency (docaudit)
    # Pure-stdlib AST gate: it only PARSES cmd/m3c-tools and cmd/skillctl, so it
    # needs no cgo and no PortAudio, and can run on the cheap runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.6"

      - name: docaudit unit tests
        run: go test -count=1 ./cmd/docaudit/

      - name: Every real flag documented, every documented flag real
        run: go run ./cmd/docaudit -cli all

      - name: verbaudit unit tests
        run: go test -count=1 ./cmd/verbaudit/

      - name: Every dispatched verb registered (FR-0113)
        run: go run ./cmd/verbaudit

  test:
    name: Unit Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.6"

      - name: Install PortAudio
        run: brew install portaudio

      # SPEC-0176 §3.1: every package under ./pkg/ now gates the build.
      # Race detector catches concurrency bugs in the retry queue, the
      # background scheduler, and the new pocket cloud-sync goroutines.
      # Also race the m3c-tools command package (menubar + plaud-sync
      # goroutines, retry runner, bulk-progress) and the skillctl-demo
      # command (SSE event bus): previously only ./pkg/... and
      # ./cmd/skillctl/... (skillctl-race job) were exercised under -race.
      - name: Run unit tests (-race, ./pkg/... + m3c-tools/skillctl-demo cmds)
        run: go test -race -count=1 ./pkg/... ./cmd/m3c-tools/... ./cmd/skillctl-demo/...

      - name: Run e2e tests (allow-list)
        run: go test -v -count=1 ./e2e/ -run "TestComposite|TestBuild|TestParseTagLine|TestER1Config|TestER1Queue|TestER1EnqueueFailure|TestUploadFailure|TestRecorderEncodeWAV|TestRecorderStats|TestExportsDB|TestFilesDB|TestHashFile|TestFormatterLoader|TestPrettyPrint|TestFormatTranscript|TestFormatSnippet|TestFormatKeyValue|TestFormatTable|TestFormatSection|TestFormatStatusLine|TestTranslateFlagParsing|TestTranslateNotTranslatable|TestTranslateTranslatable|TestRetryQueue|TestRetryBackoffTiming|TestRetryBackoffCustomBase|TestRetryProcessingOrder|TestRetryPartialFailure|TestRetryMaxRetriesDropsEntry|TestRetryDropCallback|TestRetryRespectsBackoffDelay|TestRetryProcessesAfterBackoffElapsed|TestRetryGracefulShutdownOnCancel|TestRetryRunStopsOnContextCancel|TestRetryRunProcessesMultipleCycles|TestRetryEmptyQueue|TestRetryOnRetryCallback|TestTranscriptFilter|TestProxy|TestRetryRunner|TestBackgroundRetry|TestTranscriptImport|TestTranscriptList|TestTranscriptExport|TestScheduleCommand|TestStatusCommand|TestCancelCommand|TestScheduleStatusCancelWorkflow|TestCLI|TestRepoRoot|TestWriteFixture|TestFixtureDir|TestTempDataDir|TestWithEnv|TestRunCLIWithEnv|TestImporter"

  skillctl-race:
    name: skillctl Security Tests (-race)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.6"

      - name: Install PortAudio
        run: brew install portaudio

      # SPEC-0251 (P1, LOT D-ci): the skillctl trust layer is the highest-value
      # security surface (install verification, signing/revocation, two-step
      # install tokens) and also the largest concurrency surface (install-token
      # HMAC key persistence, run/awareness state). The general unit-test job
      # already runs ./pkg/... under -race, but ./cmd/skillctl/..., where the
      # security-critical command wiring and e2e install tests live, was never
      # exercised with the race detector. Run both explicitly, green-or-fail.
      - name: Run skillctl security tests (-race)
        run: go test -race -count=1 ./cmd/skillctl/... ./pkg/skillctl/...

  sim-gate:
    name: Trust-Plane Simulation (theory vs measurement)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.6"

      # WF-004: the trust plane is checked twice, in two ways that can disagree.
      #
      # First the specification alone, with no binary in the loop: the gate
      # composition is enumerated over its whole state space, and an unsound
      # specification fails here before anybody builds anything.
      #
      # Then the real skillctl against that specification, over a covering array
      # of strength 2. Pass is all three of conflicts, invariant violations and
      # residual at zero. A residual is the interesting one: it catches a defect
      # that moves pulls from one outcome bin to another, which is exactly the
      # shape of the live fail-open found on 2026-09-04, where a revoked bundle
      # was accepted whenever a reviewer key was pinned.
      #
      # Hermetic by construction, and deliberately so: every scenario runs in a
      # throwaway HOME against a bare local git registry created inside the job.
      # No ER1, no GitHub, no credentials. A trust decision gated on a fetch that
      # is quietly satisfied by an ambient registry is not being tested at all.
      - name: Specification self-check
        run: make sim-theory

      - name: Simulation gate
        run: make sim

  # SPEC-0251 §5 supply-chain hygiene ─────────────────────────────────────────
  govulncheck:
    name: govulncheck (reachable CVEs)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.6"

      # The cgo packages (recorder/menubar) need PortAudio to typecheck, so run
      # on macOS like the other jobs rather than a pure-Go ubuntu runner.
      - name: Install PortAudio
        run: brew install portaudio

      # govulncheck fails ONLY on vulns reachable from our code. The toolchain is
      # pinned to a patched Go (go1.26.5, via go.mod `toolchain` + setup-go) so the
      # stdlib CVEs older toolchains carried are gone; this job keeps them from
      # regressing. Standalone (not in any build job's `needs`) so a fresh upstream
      # CVE blocks merge but never the release builds.
      - name: govulncheck ./...
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # full history for a complete secret scan

      # .gitleaks.toml already drives the local pre-commit hook, but the hook is
      # opt-in per clone. Enforce it in CI over full history. Pinned to the same
      # gitleaks version validated locally; exits non-zero on any finding (blocks).
      - name: Install gitleaks
        run: |
          # CD-T2: pin the tarball hash and verify integrity BEFORE extract/install
          # (modeled on tools/skillctl-install.sh's sha256 gate). A swapped tarball
          # at the release origin fails `sha256sum -c` and never reaches `install`.
          GITLEAKS_SHA256="79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Scan full history (config-aware)
        run: gitleaks git . --config .gitleaks.toml --no-banner --redact

  # CD-T4: go.mod/go.sum must already be tidy in the repo. GoReleaser no longer
  # runs `go mod tidy` at release time (that hook was removed), so an untidy
  # module graph must be caught here at PR/push time, not papered over silently
  # during a release build.
  mod-tidy-check:
    name: go mod tidy is a no-op
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.6"

      - name: go mod tidy && git diff --exit-code
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  build-macos:
    name: Build macOS (arm64 + amd64)
    runs-on: macos-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.6"

      - name: Install PortAudio (Homebrew, for native arm64 build)
        run: brew install portaudio pkg-config

      - name: Build universal PortAudio (for amd64 cross-compile)
        run: bash scripts/build-portaudio-universal.sh

      - name: Build darwin/arm64 (native)
        run: |
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 \
            go build -o build/m3c-tools-darwin-arm64 ./cmd/m3c-tools

      - name: Build darwin/amd64 (cross-compile with universal PortAudio)
        run: |
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 \
            CGO_CFLAGS="-I$(pwd)/lib/portaudio" \
            CGO_LDFLAGS="-L$(pwd)/lib/portaudio -framework CoreAudio -framework AudioToolbox -framework AudioUnit -framework CoreFoundation -framework CoreServices" \
            go build -o build/m3c-tools-darwin-amd64 ./cmd/m3c-tools

      - name: Verify binaries
        run: |
          file build/m3c-tools-darwin-arm64
          file build/m3c-tools-darwin-amd64

      - name: Build POCs
        run: |
          go build -o build/poc-transcript ./cmd/poc-transcript
          go build -o build/poc-menubar ./cmd/poc-menubar
          go build -o build/poc-whisper ./cmd/poc-whisper
          go build -o build/poc-recorder ./cmd/poc-recorder

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: m3c-tools-macos
          retention-days: 7
          path: |
            build/m3c-tools-darwin-arm64
            build/m3c-tools-darwin-amd64

  build-cross:
    name: Build Cross-Platform (Linux + Windows)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.6"

      - name: Build linux/amd64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -o build/m3c-tools-linux-amd64 ./cmd/m3c-tools

      - name: Build windows/amd64
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -o build/m3c-tools-windows-amd64.exe ./cmd/m3c-tools

      - name: Verify Linux binary
        run: |
          file build/m3c-tools-linux-amd64
          build/m3c-tools-linux-amd64 help

      - name: Upload cross-platform artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: m3c-tools-cross
          retention-days: 7
          path: |
            build/m3c-tools-linux-amd64
            build/m3c-tools-windows-amd64.exe
