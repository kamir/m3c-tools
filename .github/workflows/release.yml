name: Release

on:
  push:
    tags:
      - 'v*'

# CD-T6: least-privilege default: read-only for the whole workflow; the single
# job that creates the GitHub Release elevates to contents: write per-job below.
permissions:
  contents: read

env:
  GO_VERSION: "1.26.6"
  # CD-T4: builds must use go.sum as-is; never mutate the module graph mid-build.
  GOFLAGS: -mod=readonly

jobs:
  # -----------------------------------------------------------------------
  # Docs gate FIRST. A tag push skips `make release` (and therefore
  # scripts/check-docs.sh), so without this job the CLI/manual gate could be
  # bypassed by tagging directly. Every build job needs it.
  # -----------------------------------------------------------------------
  docs-gate:
    name: CLI/manual consistency (docaudit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: docaudit unit tests
        run: go test -count=1 ./cmd/docaudit/

      - name: Every real flag documented, every documented flag real
        run: go run ./cmd/docaudit -cli all

      - name: No U+2014 EM DASH in the tracked tree (CODESTYLE.md)
        run: ./scripts/check-no-emdash.sh

  # -----------------------------------------------------------------------
  # SBOM. H5: a CycloneDX SBOM of the product build inputs, BLOCKING. Every
  # release is enterprise-grade, so "no SBOM → no release": no continue-on-error,
  # and the `release` job depends on this job (see needs: below), so a failed SBOM
  # step blocks the whole product release. Every product binary builds from the
  # same go.mod, so one source-level SBOM (path: .) represents the supply chain of
  # all of them: mirroring the skillctl channel (skillctl-release.yml). Holds no
  # signing identity (contents: read). anchore/sbom-action uploads it as the
  # workflow artifact `m3c-tools.sbom.cdx.json` for the release job to attach.
  # -----------------------------------------------------------------------
  sbom:
    name: Generate SBOM (CycloneDX)
    runs-on: ubuntu-latest
    needs: [docs-gate]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: m3c-tools.sbom.cdx.json
          artifact-name: m3c-tools.sbom.cdx.json

  # -----------------------------------------------------------------------
  # macOS: m3c-tools (CGO_ENABLED=1, needs portaudio) + skillctl
  # -----------------------------------------------------------------------
  build-macos:
    name: Build macOS (arm64 + amd64)
    runs-on: macos-latest
    needs: [docs-gate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install PortAudio (Homebrew, for native arm64 build)
        run: brew install portaudio pkg-config

      - name: Build universal PortAudio (for amd64 cross-compile)
        run: bash scripts/build-portaudio-universal.sh

      # --- m3c-tools darwin/arm64 (native CGO) ---
      - name: Build m3c-tools darwin/arm64
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          COMMIT="${GITHUB_SHA:0:8}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 \
            go build \
              -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}" \
              -o m3c-tools-darwin-arm64 ./cmd/m3c-tools

      # --- m3c-tools darwin/amd64 (cross-compile with universal PortAudio) ---
      - name: Build m3c-tools darwin/amd64
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          COMMIT="${GITHUB_SHA:0:8}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 \
            CGO_CFLAGS="-I$(pwd)/lib/portaudio" \
            CGO_LDFLAGS="-L$(pwd)/lib/portaudio -framework CoreAudio -framework AudioToolbox -framework AudioUnit -framework CoreFoundation -framework CoreServices" \
            go build \
              -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}" \
              -o m3c-tools-darwin-amd64 ./cmd/m3c-tools

      # --- skillctl darwin (pure Go, no CGO) ---
      - name: Build skillctl darwin/arm64
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          COMMIT="${GITHUB_SHA:0:8}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
            go build \
              -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}" \
              -o skillctl-darwin-arm64 ./cmd/skillctl

      - name: Build skillctl darwin/amd64
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          COMMIT="${GITHUB_SHA:0:8}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 \
            go build \
              -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}" \
              -o skillctl-darwin-amd64 ./cmd/skillctl

      # --- Package ---
      - name: Package macOS binaries
        run: |
          tar czf m3c-tools-darwin-arm64.tar.gz m3c-tools-darwin-arm64
          tar czf m3c-tools-darwin-amd64.tar.gz m3c-tools-darwin-amd64
          tar czf skillctl-darwin-arm64.tar.gz skillctl-darwin-arm64
          tar czf skillctl-darwin-amd64.tar.gz skillctl-darwin-amd64

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-binaries
          retention-days: 7
          path: |
            m3c-tools-darwin-arm64.tar.gz
            m3c-tools-darwin-amd64.tar.gz
            skillctl-darwin-arm64.tar.gz
            skillctl-darwin-amd64.tar.gz

  # -----------------------------------------------------------------------
  # Linux + Windows: m3c-tools (CGO_ENABLED=0) + skillctl via GoReleaser
  # -----------------------------------------------------------------------
  build-linux-windows:
    name: Build Linux + Windows (GoReleaser)
    runs-on: ubuntu-latest
    needs: [docs-gate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          install-only: true
          version: "~> v2"

      - name: Run GoReleaser (snapshot, no publish)
        run: goreleaser release --skip=publish --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload GoReleaser artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: goreleaser-binaries
          retention-days: 7
          path: |
            dist/m3c-tools-linux-*.tar.gz
            dist/skillctl-linux-*.tar.gz
            dist/skillctl-offline-demo-linux-*.tar.gz
            dist/m3c-tools-windows-*.zip
            dist/skillctl-windows-*.zip
            dist/skillctl-offline-demo-windows-*.zip

  # -----------------------------------------------------------------------
  # Windows NSIS installer
  # -----------------------------------------------------------------------
  build-windows-installer:
    name: Build Windows Installer (NSIS)
    runs-on: ubuntu-latest
    needs: [build-linux-windows]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Cross-compile Windows binaries
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          COMMIT="${GITHUB_SHA:0:8}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}"
          mkdir -p build/windows
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -ldflags="${LDFLAGS}" -o build/windows/m3c-tools.exe ./cmd/m3c-tools
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -ldflags="${LDFLAGS}" -o build/windows/skillctl.exe ./cmd/skillctl
          cp design/icons/menubar-icon.png build/windows/

      - name: Build NSIS installer
        run: makensis scripts/installer.nsi

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-installer
          retention-days: 7
          path: build/M3C-Tools-Setup.exe

  # -----------------------------------------------------------------------
  # CD-10: the PRODUCT channel is now signed + attested, mirroring the skillctl
  # CLI channel (skillctl-release.yml). The single "generate checksums + publish"
  # job is split into an isolated pipeline so no build/publish step ever holds the
  # provenance signing identity:
  #
  #   [3 build jobs] ─> checksums ──┬─> cosign      (keyless sign-blob of checksums.txt)
  #                                 ├─> provenance  (isolated SLSA generic generator)
  #                                 └─────────────────────────────┐
  #   [checksums, provenance] ───────────────────────> verify (slsa-verifier GATE)
  #   [checksums, cosign, provenance, verify, sbom] ─> release (publish, post-gate)
  #
  # checksums.txt is cosign-signed (keyless OIDC) and its .cosign.bundle is a
  # release asset; a SLSA provenance (*.intoto.jsonl) over every published binary
  # is generated by the SAME isolated, trusted generator the CLI channel uses and
  # is GATED by slsa-verifier before anything is published. H5: the `sbom` job
  # (CycloneDX, above) is BLOCKING and a release dependency, no SBOM → no release,
  # and m3c-tools.sbom.cdx.json ships as a release asset.
  # -----------------------------------------------------------------------

  # 1) CHECKSUMS: merge every build artifact, produce checksums.txt, and emit the
  #    base64 SLSA subjects (sha256 of every published binary). Holds NO signing
  #    identity (contents: read): it only moves bytes and computes digests.
  checksums:
    name: Checksums + SLSA subjects
    runs-on: ubuntu-latest
    needs: [build-macos, build-linux-windows, build-windows-installer]
    permissions:
      contents: read
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR artifacts/

      - name: Generate checksums.txt
        working-directory: artifacts
        run: |
          set -euo pipefail
          sha256sum *.tar.gz *.zip *.exe > checksums.txt
          echo "=== checksums.txt ==="
          cat checksums.txt

      # base64(sha256sum <all published binaries>): the SLSA generator's
      # `base64-subjects`. Same glob as checksums.txt (the binary assets only).
      - name: Compute SLSA subjects (base64 digests)
        id: hash
        working-directory: artifacts
        run: |
          set -euo pipefail
          echo "hashes=$(sha256sum *.tar.gz *.zip *.exe | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Upload checksums.txt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: product-checksums
          if-no-files-found: error
          retention-days: 7
          path: artifacts/checksums.txt

  # 2) COSIGN: keyless sign-blob of checksums.txt with the workflow's GitHub OIDC
  #    identity, verified in-job. Signing identity isolated to this job; runs NO
  #    build step. Mirrors the CLI channel's cosign job.
  cosign:
    name: cosign sign-blob checksums.txt (keyless OIDC)
    runs-on: ubuntu-latest
    needs: [checksums]
    permissions:
      contents: read
      id-token: write # keyless cosign OIDC: isolated to this job
    steps:
      - name: Download checksums.txt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: product-checksums
          path: dist

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Keyless-sign checksums.txt (GitHub OIDC)
        working-directory: dist
        run: cosign sign-blob --yes checksums.txt --bundle checksums.txt.cosign.bundle

      # Gate: fail if the bundle doesn't verify against THIS workflow's OIDC
      # identity (the release.yml @ the v* tag).
      - name: Verify the cosign signature in-job (gate)
        working-directory: dist
        run: |
          cosign verify-blob checksums.txt \
            --bundle checksums.txt.cosign.bundle \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@refs/tags/v" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Upload cosign bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: product-cosign-bundle
          if-no-files-found: error
          retention-days: 7
          path: dist/checksums.txt.cosign.bundle

  # 3) PROVENANCE: the SAME isolated, trusted SLSA generic generator the CLI
  #    channel uses. Runs in its own VM with its own OIDC identity; id-token:write
  #    lives HERE, never in a build/publish job. The provenance's builder.id = this
  #    reusable workflow @ the pinned tag, so no build step can forge it.
  #    PINNED BY TAG (not SHA): required by slsa-verifier's builder-identity check;
  #    pin-guard.yml carries the narrow, scoped exception for exactly this workflow.
  provenance:
    name: SLSA provenance (isolated generator)
    needs: [checksums]
    permissions:
      actions: read   # read the triggering run's metadata (generator requirement)
      id-token: write # keyless provenance signing: isolated to this trusted job
      contents: write # generator's documented requirement (upload path is skipped)
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.checksums.outputs.hashes }}"
      # DRAFT-safe: do NOT let the generator attach to a release. The provenance is
      # exposed as a workflow artifact (outputs.provenance-name) for verify + release.
      upload-assets: false

  # 4) VERIFY: the release GATE. Re-download every published binary + the isolated
  #    provenance, and make slsa-verifier confirm each binary's provenance was
  #    produced by the TRUSTED generator identity from THIS repo. A failure fails
  #    this job and NOTHING is published. Holds NO signing identity.
  verify:
    name: slsa-verifier gate (builder identity)
    runs-on: ubuntu-latest
    needs: [checksums, provenance]
    permissions:
      contents: read
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Download SLSA provenance
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: dist

      - name: Install slsa-verifier
        uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1

      - name: Verify provenance against the builder identity (GATE)
        working-directory: dist
        run: |
          set -euo pipefail
          PROV="${{ needs.provenance.outputs.provenance-name }}"
          BUILDER="https://github.com/slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@refs/tags/v2.1.0"
          for bin in *.tar.gz *.zip *.exe; do
            echo "::group::verify $bin"
            slsa-verifier verify-artifact "$bin" \
              --provenance-path "$PROV" \
              --source-uri "git+https://github.com/${GITHUB_REPOSITORY}" \
              --builder-id "$BUILDER"
            echo "::endgroup::"
          done
          echo "OK: every published binary verifies against the isolated SLSA generator identity."

  # 5) RELEASE: publish, and ONLY after BOTH gates (verify + cosign) pass. Holds
  #    NO signing identity (contents: write only, to create the release + upload
  #    assets). A broken provenance or cosign flow yields no release at all.
  release:
    name: Create Release (post-gate)
    runs-on: ubuntu-latest
    needs: [checksums, cosign, provenance, verify, sbom]
    permissions:
      contents: write # create the GitHub Release + upload its assets
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Download checksums.txt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: product-checksums
          path: artifacts

      - name: Download cosign bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: product-cosign-bundle
          path: artifacts

      - name: Download SLSA provenance
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: artifacts

      # H5: BLOCKING: the SBOM is a required release asset ("no SBOM → no
      # release"). The generate job is blocking, so this artifact always exists.
      - name: Download SBOM (CycloneDX)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: m3c-tools.sbom.cdx.json
          path: artifacts

      - name: List release assets
        run: ls -lhR artifacts/

      # CD-T3 (RETIRE): the UNSIGNED skillctl CLI binaries no longer ship on the
      # v* product release. The ONLY skillctl distribution is the signed
      # (cosign/OIDC + SLSA provenance) skillctl/v* path built by
      # skillctl-release.yml. Do NOT re-add skillctl-{darwin,linux,windows} assets
      # to the files list below: a second, unsigned download channel defeats the
      # pinned verification in tools/skillctl-install.sh.
      #
      # CD-10: the offline demo is published as `skillctl-offline-demo-*` (renamed
      # from `skillctl-demo-*`) so it cannot be mistaken for the signed CLI, and its
      # integrity is now covered by checksums.txt (cosign-signed) + the SLSA
      # provenance below.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          files: |
            artifacts/m3c-tools-darwin-arm64.tar.gz
            artifacts/m3c-tools-darwin-amd64.tar.gz
            artifacts/m3c-tools-linux-amd64.tar.gz
            artifacts/m3c-tools-linux-arm64.tar.gz
            artifacts/m3c-tools-windows-amd64.zip
            artifacts/skillctl-offline-demo-linux-amd64.tar.gz
            artifacts/skillctl-offline-demo-linux-arm64.tar.gz
            artifacts/skillctl-offline-demo-windows-amd64.zip
            artifacts/M3C-Tools-Setup.exe
            artifacts/checksums.txt
            artifacts/checksums.txt.cosign.bundle
            artifacts/${{ needs.provenance.outputs.provenance-name }}
            artifacts/m3c-tools.sbom.cdx.json
