name: CodeQL

# Gate 1 (H1), CodeQL half — GitHub's semantic SAST for Go, complementing gosec.
# Results land in the SAME Code Scanning dashboard and follow the SAME
# baseline-then-block model: CodeQL uploads alerts but does not fail the job on
# findings; blocking is the "Require code scanning results" branch-protection
# setting (see gosec.yml for the knob). So this job is green on master today.
#
# build-mode: none — Go is extracted WITHOUT compiling. This sidesteps the cgo
# build (recorder/menubar need PortAudio) that autobuild would hit on the Linux
# runner, and is the mode GitHub's own default CodeQL setup uses for Go. If you
# ever want autobuild-level precision instead, switch to `build-mode: autobuild`
# and move this job to macos-latest with `brew install portaudio`.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "27 3 * * 1" # weekly (Mon 03:27 UTC) — catch new queries vs unchanged code

# CD-T6: least-privilege default token for the whole workflow.
permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL Analyze (Go)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload CodeQL results to Code Scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.6"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          languages: go
          build-mode: none
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          category: "/language:go"
