name: skillctl Release (SLSA L3 provenance)

# SPEC-0253 + CD-T5 (SLSA Build Level 3 isolation).
#
# Build + sign skillctl releases in a clean CI runner with KEYLESS Sigstore/cosign
# + GitHub OIDC: no long-lived private key in the repo or in workflow secrets.
# Triggered ONLY on skillctl/v* tags (disjoint from the `v*` product-release
# workflow in release.yml, which this does not touch).
#
# --- Why this is SLSA Build L3 (non-falsifiable provenance) -------------------
# The SLSA provenance is generated by an ISOLATED, TRUSTED reusable workflow, the
# slsa-github-generator generic generator, that runs in its own job/VM with its
# own GitHub OIDC identity. The `build` job (which runs `go build`, i.e. the step
# an attacker would target) holds NO signing identity at all (contents: read):
# it can neither sign provenance, nor sign an attestation, nor sign a blob. It only
# emits the artifact digests. The provenance is therefore signed by the GENERATOR's
# identity, `builder.id` = the generator reusable workflow @ its pinned tag, which
# the build job cannot assume. Even a fully compromised build step cannot forge
# provenance that names the trusted builder. The `verify` job pins that builder
# identity with `slsa-verifier verify-artifact` and MUST pass before the draft is
# cut. (The previous flow generated provenance in-job with `attest-build-provenance`
# while the job held id-token, only ~hardened-L2; that step is removed here.)
#
# --- Job graph ----------------------------------------------------------------
#   build ──┬─> provenance   (SLSA generic generator; isolated OIDC signing)
#           ├─> cosign       (defense-in-depth SHA256SUMS keyless signature)
#           └───────────────────────────────┐
#   [build, provenance] ─────────────> verify (slsa-verifier GATE)
#   [build, provenance, cosign, verify] ─> release (DRAFT only)
#   [release] ───────────────────────> smoke  (HARD Tier-1 5-platform GATE, H9)
#
# The `build` job's CycloneDX SBOM step is BLOCKING (H5): no SBOM → no release.
#
# Output format mirrors tools/skillctl-release.sh exactly (raw per-arch binaries +
# SHA256SUMS) so the published install.sh keeps working; this adds a signed SLSA
# provenance (*.intoto.jsonl), a cosign bundle, and a CycloneDX SBOM.
#
# Creates a DRAFT release. The operator reviews it and promotes it: and, DURING
# THE ED25519->COSIGN TRANSITION, also attaches the ed25519 SHA256SUMS.sig (cut
# locally with tools/skillctl-release.sh, whose deterministic build produces a
# byte-identical SHA256SUMS) so users WITHOUT cosign still verify via the pinned
# ed25519 fallback in install.sh. Once cosign is the only track, that step drops.

on:
  push:
    tags:
      - 'skillctl/v*'

# Least privilege by default: each job widens ONLY what it needs. id-token:write
# is granted to exactly two jobs: `provenance` (the trusted generator's signing)
# and `cosign` (the defense-in-depth blob signature). It is never granted to the
# job that compiles the code (`build`) nor to the job that publishes (`release`).
permissions:
  contents: read

env:
  # CD-T4: builds use go.sum as-is; never mutate the module graph mid-build.
  GOFLAGS: -mod=readonly

jobs:
  # 0) DOCS GATE: a skillctl/v* tag push skips `make release` (and therefore
  #    scripts/check-docs.sh), so the CLI/manual gate is re-run here to close
  #    that bypass. Scoped to `-cli skillctl`: this workflow releases skillctl,
  #    so m3c-tools drift must not block it. Holds no signing identity, so it
  #    does not touch the SLSA L3 isolation argument below.
  docs-gate:
    name: skillctl CLI/manual consistency (docaudit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.6"

      - name: Every real skillctl flag documented, every documented flag real
        run: go run ./cmd/docaudit -cli skillctl

      - name: No U+2014 EM DASH in the tracked tree (CODESTYLE.md)
        run: ./scripts/check-no-emdash.sh

  # 1) BUILD: compiles the 5 arches and emits their digests. Holds NO signing
  #    identity (contents: read only): it CANNOT sign provenance, an attestation,
  #    or a blob. The only thing it hands the trusted generator is a base64 string
  #    of artifact hashes. This is the isolation boundary the L3 claim rests on.
  build:
    name: Build 5 arches + digests
    runs-on: ubuntu-latest
    needs: [docs-gate]
    permissions:
      contents: read
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.6" # patched toolchain (SPEC-0251 §5): CVE-free binaries (GO-2026-5856)

      # 5-arch matrix, pure Go (skillctl needs no CGO), version-stamped with the
      # full skillctl/vX.Y.Z tag. Exactly tools/skillctl-release.sh's set.
      - name: Build skillctl (5 arches)
        run: |
          set -euo pipefail
          mkdir -p dist
          build() {
            CGO_ENABLED=0 GOOS="$1" GOARCH="$2" \
              go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "dist/skillctl-$1-$2${3:-}" ./cmd/skillctl
          }
          build darwin arm64
          build darwin amd64
          build linux amd64
          build linux arm64
          build windows amd64 .exe

      - name: SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum skillctl-darwin-amd64 skillctl-darwin-arm64 \
                    skillctl-linux-amd64 skillctl-linux-arm64 \
                    skillctl-windows-amd64.exe > SHA256SUMS
          cat SHA256SUMS

      # base64(sha256sum ...): the SLSA generator's `base64-subjects`. This string
      # is the ONLY thing the untrusted build job hands the trusted generator.
      - name: Compute SLSA subjects (base64 digests)
        id: hash
        working-directory: dist
        run: |
          set -euo pipefail
          echo "hashes=$(sha256sum \
              skillctl-darwin-arm64 skillctl-darwin-amd64 \
              skillctl-linux-amd64 skillctl-linux-arm64 \
              skillctl-windows-amd64.exe | base64 -w0)" >> "$GITHUB_OUTPUT"

      # SPEC-0253 follow-up: emit a CycloneDX SBOM of the Go build inputs. All 5
      # arches build from the same go.mod with no CGO and an identical import set
      # (only GOOS/GOARCH differ), so one source-level SBOM represents the supply
      # chain of every published binary. H5: BLOCKING: no continue-on-error. Every
      # release is enterprise-grade, so "no SBOM → no release": a failed SBOM step
      # fails the build job and the whole release. anchore/sbom-action uploads it as
      # the workflow artifact `skillctl.sbom.cdx.json` for the release job to consume.
      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/skillctl.sbom.cdx.json
          artifact-name: skillctl.sbom.cdx.json

      # Hand the binaries + SHA256SUMS to the downstream jobs. No id-token here;
      # this job just moves bytes.
      - name: Upload binaries + SHA256SUMS
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: skillctl-dist
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/skillctl-darwin-arm64
            dist/skillctl-darwin-amd64
            dist/skillctl-linux-amd64
            dist/skillctl-linux-arm64
            dist/skillctl-windows-amd64.exe
            dist/SHA256SUMS

  # 2) PROVENANCE: the ISOLATED, TRUSTED SLSA generic generator. Runs in its own
  #    job/VM with its own OIDC identity; id-token:write lives HERE, never in the
  #    build job. The provenance's builder.id = this reusable workflow @ the pinned
  #    tag, so the build job (a different identity) cannot forge it.
  #
  #    PINNED BY TAG, NOT SHA, intentional and REQUIRED: slsa-verifier verifies
  #    the generator ran from this signed vX.Y.Z release tag, and a commit-SHA ref
  #    breaks builder-identity verification (documented slsa-github-generator
  #    constraint). pin-guard.yml carries a narrow, scoped exception for exactly
  #    this reusable workflow. Tag movement is detected by slsa-verifier + the Rekor
  #    transparency log, so the tag is not "mutable" in the harmful sense.
  #    v2.1.0 = commit f7dd8c54c2067bafc12ca7a55595d5ee9b75204a (recorded for audit).
  provenance:
    name: SLSA L3 provenance (isolated generator)
    needs: [build]
    permissions:
      actions: read   # read the triggering run's metadata (generator requirement)
      id-token: write # keyless provenance signing: isolated to this trusted job
      contents: write # generator's documented requirement (upload path is skipped)
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      # DRAFT-first: do NOT let the generator publish/attach to a release. The
      # provenance is still exposed as a workflow artifact (outputs.provenance-name)
      # for the verify + release jobs to consume.
      upload-assets: false

  # 3) COSIGN: defense-in-depth (retained from the pre-L3 flow): keyless-sign
  #    SHA256SUMS with the install.sh-pinned OIDC identity and verify it in-job.
  #    Signing identity isolated to this job; it runs NO build step.
  cosign:
    name: cosign sign-blob SHA256SUMS (defense-in-depth)
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # keyless cosign OIDC: isolated to this job
    steps:
      - name: Download binaries + SHA256SUMS
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: skillctl-dist
          path: dist

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Keyless-sign SHA256SUMS (GitHub OIDC)
        working-directory: dist
        run: cosign sign-blob --yes SHA256SUMS --bundle SHA256SUMS.cosign.bundle

      # Gate: fail if the bundle doesn't verify against THIS workflow's OIDC
      # identity: the same identity install.sh pins.
      - name: Verify the cosign signature in-job (gate)
        working-directory: dist
        run: |
          cosign verify-blob SHA256SUMS \
            --bundle SHA256SUMS.cosign.bundle \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/skillctl-release\.yml@refs/tags/skillctl/v" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Upload cosign bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: skillctl-cosign-bundle
          if-no-files-found: error
          retention-days: 7
          path: dist/SHA256SUMS.cosign.bundle

  # 4) VERIFY: the SLSA L3 release GATE. Downloads the binaries + the isolated
  #    provenance, then makes slsa-verifier confirm that each binary's provenance
  #    was produced by the TRUSTED generator identity (builder.id) from THIS repo.
  #    If verification fails, this job fails and the draft is never cut. Holds NO
  #    signing identity (contents: read).
  verify:
    name: slsa-verifier gate (L3 builder identity)
    needs: [build, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download binaries + SHA256SUMS
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: skillctl-dist
          path: dist

      - name: Download SLSA provenance
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: dist

      - name: Install slsa-verifier
        uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1

      - name: Verify provenance against the L3 builder identity (GATE)
        working-directory: dist
        run: |
          set -euo pipefail
          PROV="${{ needs.provenance.outputs.provenance-name }}"
          BUILDER="https://github.com/slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@refs/tags/v2.1.0"
          for bin in skillctl-darwin-arm64 skillctl-darwin-amd64 \
                     skillctl-linux-amd64 skillctl-linux-arm64 \
                     skillctl-windows-amd64.exe; do
            echo "::group::verify $bin"
            slsa-verifier verify-artifact "$bin" \
              --provenance-path "$PROV" \
              --source-uri "git+https://github.com/${GITHUB_REPOSITORY}" \
              --builder-id "$BUILDER"
            echo "::endgroup::"
          done
          echo "OK: all 5 binaries verify against the isolated L3 generator identity."

  # 5) RELEASE: DRAFT only, and ONLY after BOTH gates (verify + cosign) pass.
  #    Holds NO signing identity (contents: write only, to create the draft). A
  #    broken provenance or cosign flow yields no draft at all.
  release:
    name: Draft release (post-gate)
    needs: [build, provenance, cosign, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the (draft) release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download binaries + SHA256SUMS
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: skillctl-dist
          path: dist

      - name: Download SLSA provenance
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: dist

      - name: Download cosign bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: skillctl-cosign-bundle
          path: dist

      # H5: BLOCKING: the SBOM is a required release asset ("no SBOM → no
      # release"). The generate step is blocking, so this artifact always exists;
      # if it is somehow absent this download fails and no draft is cut.
      - name: Download SBOM (CycloneDX)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: skillctl.sbom.cdx.json
          path: dist

      - name: Stage installer, notes, pinned pubkey
        run: |
          set -euo pipefail
          cp tools/skillctl-install.sh dist/install.sh
          # Stamp the installer's default RELEASE_BASE to THIS tag so
          # `curl .../${GITHUB_REF_NAME}/install.sh | bash` (no override) installs
          # THIS release. The committed default is a stale fixed tag otherwise.
          sed -i "s#download/skillctl/[^\"}]*#download/${GITHUB_REF_NAME}#" dist/install.sh
          grep 'RELEASE_BASE:-' dist/install.sh | head -1
          # Same for the PowerShell installer. Its default RELEASE_BASE is a
          # single-quoted PS string literal, so match up to the closing quote.
          cp tools/skillctl-install.ps1 dist/install.ps1
          sed -i "s#download/skillctl/[^']*#download/${GITHUB_REF_NAME}#" dist/install.ps1
          grep 'download/skillctl' dist/install.ps1 | head -1
          [ -f INFRA/skillctl-release.pub ] && cp INFRA/skillctl-release.pub dist/ || true
          # release/ was gitignored wholesale before; RELEASE_NOTES.md is tracked.
          NOTES="release/${GITHUB_REF_NAME}/RELEASE_NOTES.md"
          if [ -f "$NOTES" ]; then echo "using $NOTES"; cp "$NOTES" dist/RELEASE_NOTES.md; \
          else echo "WARN: no $NOTES: falling back to the placeholder body"; \
          printf '# skillctl %s\n\nKeyless (cosign/OIDC) + SLSA Build L3 provenance release.\n' "${GITHUB_REF_NAME#skillctl/}" > dist/RELEASE_NOTES.md; fi

      # DRAFT: the operator reviews, (transition) attaches the ed25519
      # SHA256SUMS.sig, and promotes. A broken cosign/provenance flow yields a
      # draft that never gets cut, never a published release.
      - name: Create draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          draft: true
          make_latest: false
          name: "skillctl ${{ github.ref_name }}"
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/skillctl-darwin-arm64
            dist/skillctl-darwin-amd64
            dist/skillctl-linux-amd64
            dist/skillctl-linux-arm64
            dist/skillctl-windows-amd64.exe
            dist/SHA256SUMS
            dist/SHA256SUMS.cosign.bundle
            dist/${{ needs.provenance.outputs.provenance-name }}
            dist/install.sh
            dist/install.ps1
            dist/skillctl-release.pub
            dist/skillctl.sbom.cdx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 6) SMOKE GATE. H9: the HARD Tier-1 platform gate. Runs AFTER the draft is
  #    created and exercises the full install → verify → execute → uninstall
  #    lifecycle on ALL 5 Tier-1 platforms (macOS arm64/amd64, Linux amd64/arm64,
  #    Windows amd64) against the EXACT bytes this release ships. A reusable 5-way
  #    matrix (skillctl-smoke-matrix.yml); each leg STAGES the same-run build
  #    artifacts (skillctl-dist + skillctl-cosign-bundle), so the gate stays on
  #    contents:read and never has to read the draft release. fail-fast:false, so
  #    every platform is reported. If ANY Tier-1 leg fails, this job fails → the
  #    release run goes RED. Under the DRAFT-first model (the operator promotes the
  #    draft by hand), a red smoke gate is the signal (and, as a required status
  #    check, the enforcement) that the draft must NOT be promoted to a published
  #    release.
  smoke:
    name: Tier-1 platform smoke gate (5 platforms)
    needs: [release]
    permissions:
      contents: read
    uses: ./.github/workflows/skillctl-smoke-matrix.yml
    with:
      tag: ${{ github.ref_name }}

  # 7) EVIDENCE: H10 capstone (WF-001 "Trust Binder"). ASSEMBLE the Release
  #    Evidence Bundle: one signed, machine-readable proof that these exact
  #    artifacts came from THIS commit AND passed the mandatory gate-set G at
  #    time T. It is an INDEX of evidence, not a second copy: references[] POINT
  #    at the already-produced cosign bundle / SLSA provenance / SBOM by URL +
  #    digest. Nothing is re-embedded or re-verified here, so the SLSA L3 build
  #    isolation is untouched.
  #
  #    Runs LAST (after the draft AND the post-draft smoke gate) so platform-smoke
  #    can be recorded honestly. Holds NO signing identity (contents:read only):
  #    ASSEMBLY IS ISOLATED FROM SIGNING, only the downstream evidence-sign job
  #    signs. checks:read lets it read the release commit's CI check-run
  #    conclusions: the CI-plane gates (unit-tests/race/e2e/lint/gosec/
  #    govulncheck/gitleaks) ran in ci.yml + gosec.yml on this commit BEFORE the
  #    tag, so they are GATHERED (an unmatched/unreachable check → skip, i.e.
  #    "not confirmed", never a silent pass), not asserted. The release-plane
  #    gates come from this run's needs.<job>.result.
  #
  #    enterprise_ready is RECOMPUTED inside the tool from the gate results under
  #    the fixed policy G (12 required + threat-model-delta advisory); a strict
  #    consumer recomputes it again. This job never trusts a stored bool.
  evidence:
    name: Assemble release-evidence bundle (Trust Binder)
    needs: [docs-gate, build, provenance, cosign, verify, release, smoke]
    # Run whenever the draft was cut (release succeeded) EVEN IF the post-draft
    # smoke gate failed: a red smoke must be recorded as platform-smoke:fail /
    # enterprise_ready:false, not suppress the evidence entirely.
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read   # read the release commit's CI check-run conclusions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.6"

      - name: Download binaries + SHA256SUMS
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: skillctl-dist
          path: dist

      - name: Assemble release-evidence.json (+ in-toto statement)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROV_NAME: ${{ needs.provenance.outputs.provenance-name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DOCAUDIT_RESULT: ${{ needs['docs-gate'].result }}
          SBOM_RESULT: ${{ needs.build.result }}
          SLSA_RESULT: ${{ needs.verify.result }}
          COSIGN_RESULT: ${{ needs.cosign.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
        run: |
          set -euo pipefail

          # --- CI-plane gates: read THIS commit's check-run conclusions -------
          # ci.yml + gosec.yml run on the branch/PR before the tag; their checks
          # attach to this commit SHA. An absent/in-progress/unmatched check
          # resolves to "skip" (not confirmed), never a silent pass.
          declare -A CONCL
          RAW="$(gh api --paginate \
                   -H 'Accept: application/vnd.github+json' \
                   "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
                   --jq '.check_runs[] | [.name, (.conclusion // "")] | @tsv' 2>/dev/null || true)"
          while IFS=$'\t' read -r cname cconcl; do
            [ -n "$cname" ] && CONCL["$cname"]="$cconcl"
          done <<< "$RAW"
          resolve() {
            local v="${CONCL[$1]:-}"
            if [ -z "$v" ]; then v=skip; fi
            printf '%s' "$v"
          }

          # --- checksums reference tamper-evidence: sha256 of SHA256SUMS -------
          CHECKSUMS_SHA="$(sha256sum dist/SHA256SUMS | awk '{print $1}')"

          # --- gate-set G (CI-plane gathered by check-name; release-plane from
          #     needs.<job>.result; threat-model-delta advisory) ---------------
          GATES=(
            -gate "unit-tests=$(resolve 'Unit Tests')"
            -gate "e2e=$(resolve 'Unit Tests'),note=runs as a step inside the Unit Tests job"
            -gate "race=$(resolve 'skillctl Security Tests (-race)')"
            -gate "lint=$(resolve 'Lint & Vet')"
            -gate "gosec-sast=$(resolve 'gosec SAST (SARIF -> Code Scanning)')"
            -gate "govulncheck-cve=$(resolve 'govulncheck (reachable CVEs)')"
            -gate "gitleaks-secret=$(resolve 'gitleaks (secret scan)')"
            -gate "docaudit=${DOCAUDIT_RESULT}"
            -gate "sbom=${SBOM_RESULT},note=CycloneDX SBOM is a blocking step of the build job"
            -gate "slsa-provenance=${SLSA_RESULT},note=slsa-verifier verify-artifact gate over the isolated L3 generator provenance"
            -gate "cosign-signature=${COSIGN_RESULT}"
            -gate "platform-smoke=${SMOKE_RESULT}"
            -gate "threat-model-delta=skip,evidence=https://github.com/kamir/m3c-tools-maintenance/tree/main/CISO-WORK/scans,note=manual security-triad review; off-CI (advisory)"
          )

          go run ./cmd/release-evidence \
            -commit "${GITHUB_SHA}" \
            -tag "${GITHUB_REF_NAME}" \
            -repo "${GITHUB_REPOSITORY}" \
            -run-url "${RUN_URL}" \
            -channel skillctl \
            -artifacts dist/SHA256SUMS \
            -checksums-sha256 "${CHECKSUMS_SHA}" \
            -provenance-name "${PROV_NAME}" \
            -sbom-name skillctl.sbom.cdx.json \
            -schema docs/security/release-evidence.schema.json \
            -out dist/release-evidence.json \
            -intoto dist/release-evidence.intoto.json \
            "${GATES[@]}"

          echo "::group::release-evidence.json"
          cat dist/release-evidence.json
          echo "::endgroup::"

      - name: Upload release-evidence (unsigned bundle + statement)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-evidence
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/release-evidence.json
            dist/release-evidence.intoto.json

  # 8) EVIDENCE-SIGN: keyless cosign sign-blob of the assembled bundle, with the
  #    SAME OIDC identity that signs SHA256SUMS (install.sh already pins it).
  #    Holds ONLY id-token:write (no contents:write, runs no build): SIGNING IS
  #    ISOLATED to this job, mirroring the `cosign` job. Verifies its own
  #    signature in-job as a gate before publishing the bundle.
  evidence-sign:
    name: Sign release-evidence (cosign keyless)
    needs: [evidence]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # keyless cosign OIDC: isolated to this job
    steps:
      - name: Download release-evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-evidence
          path: dist

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: cosign sign-blob release-evidence.json (GitHub OIDC)
        working-directory: dist
        run: cosign sign-blob --yes release-evidence.json --bundle release-evidence.json.cosign.bundle

      # Gate: the bundle must verify against THIS workflow's OIDC identity: the
      # same identity install.sh pins for SHA256SUMS.
      - name: Verify the cosign signature in-job (gate)
        working-directory: dist
        run: |
          cosign verify-blob release-evidence.json \
            --bundle release-evidence.json.cosign.bundle \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/skillctl-release\.yml@refs/tags/skillctl/v" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Upload cosign bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-evidence-cosign
          if-no-files-found: error
          retention-days: 7
          path: dist/release-evidence.json.cosign.bundle

  # 9) EVIDENCE-ATTACH: attach the bundle + its cosign bundle + the in-toto
  #    statement to the EXISTING draft (contents:write only; runs no build, holds
  #    no signing identity). `gh release upload --clobber` adds assets surgically
  #    without touching the draft's name/body. The bundle is produced AFTER the
  #    draft is cut (it must record the post-draft smoke gate), so it is attached
  #    here rather than in the release job's initial `files:` list.
  evidence-attach:
    name: Attach release-evidence to the draft
    needs: [evidence, evidence-sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write # add assets to the existing draft release
    steps:
      - name: Download release-evidence (bundle + statement)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-evidence
          path: dist

      - name: Download release-evidence cosign bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-evidence-cosign
          path: dist

      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" \
            dist/release-evidence.json \
            dist/release-evidence.json.cosign.bundle \
            dist/release-evidence.intoto.json \
            --clobber
