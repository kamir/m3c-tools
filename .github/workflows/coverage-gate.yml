name: Coverage (ratchet)

# Gate 2 (H3): ratchet test coverage over the skillctl trust/security surface.
#
# The floors live in .testcoverage.yml, each seeded from the coverage the package
# ACTUALLY had when the gate was added (rounded down). So this job is GREEN on
# master today and can only move UP: any change that drops a package below its
# recorded floor fails here. It is not a "reach 85%" mandate. It is a no-regression
# ratchet. See .testcoverage.yml for the per-package numbers and the rationale.
#
# Runs on macos-latest (matching the environment the floors were measured in, and
# the existing `test` / `skillctl-race` jobs) so coverage reproduces: git,
# symlinks, tz db and POSIX perms are all present, so the OS-/tool-gated test
# skips do not fire, and the live-remote env-gated tests are skipped here exactly
# as they were when the floors were measured.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Concurrency: one run per ref, and a superseded pull-request run is cancelled.
# The group carries a LITERAL prefix rather than ${{ github.workflow }}, because
# inside a reusable workflow that context holds the CALLER's name: a group built
# from it can collide with the caller's own group, and a called workflow waiting
# on its caller never starts. A literal cannot do that, in any file.
#
# cancel-in-progress is conditional on purpose. A superseded pull-request run
# measures a commit nobody will merge, so cancelling it costs nothing. A run on
# main or master is the record for that commit, and cancelling it would leave a
# merged commit with no evidence that this gate ever passed on it.
concurrency:
  group: coverage-gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# CD-T6: least-privilege default token for the whole workflow.
permissions:
  contents: read

jobs:
  coverage:
    name: Ratchet coverage (skillctl trust surface)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      # Does this change touch code at all, or only prose. Measured over the
      # last 60 merged pull requests: one in ten changes nothing but prose, and
      # the five macOS jobs it pays for anyway measured 872 seconds together,
      # billed at the macOS rate. A file ending in .md cannot change what a Go
      # test does. (872 is the sum of five MEDIANS from one collection on
      # 2026-09-17, up to six completed runs per job: Lint & Vet 149, Unit Tests
      # 294, skillctl Security Tests 144, Build macOS 177, Ratchet coverage 108.
      # It said 894 first, which added four numbers from one run to a fifth from
      # somewhere else. Numbers from two runs do not belong in one sum.)
      #
      # The JOB still runs and still reports, and that is deliberate. A job
      # skipped by an `if:` reports the conclusion "skipped", which GitHub's
      # branch protection counts as satisfied: gating a REQUIRED job on a path
      # filter switches the gate off for those paths with nothing turning red.
      # Only the expensive steps below are conditional, so a docs-only pull
      # request still gets a real green tick from a job that really ran.
      #
      # Fail-closed in every direction: an undeterminable base, an empty file
      # list, a git error or any event other than pull_request all answer
      # code=true and everything runs. scripts/ci-classify.sh --selftest plants
      # a code file in an otherwise prose-only list and checks the answer flips.
      - id: classify
        name: "Classify: prose-only change, or code"
        run: ./scripts/ci-classify.sh --github-output

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: steps.classify.outputs.code == 'true'
        with:
          go-version-file: go.mod

      - name: Install PortAudio (cmd/skillctl -> menubar cgo must build)
        if: steps.classify.outputs.code == 'true'
        run: brew install portaudio

      # Scope = the skillctl trust surface only (see .testcoverage.yml). -covermode=atomic
      # so the profile is valid even if a future change adds -race here.
      - name: Generate coverage profile
        if: steps.classify.outputs.code == 'true'
        run: go test ./pkg/skillctl/... ./cmd/skillctl/... -covermode=atomic -coverprofile=cover.out

      # Pinned go-test-coverage release (CD-T2: an exact version tag, never a
      # floating ref), installed via `go install` like the other Go tools in ci.yml.
      - name: Install go-test-coverage (pinned)
        if: steps.classify.outputs.code == 'true'
        run: go install github.com/vladopajic/go-test-coverage/v2@v2.19.0

      - name: Enforce coverage ratchet (.testcoverage.yml)
        if: steps.classify.outputs.code == 'true'
        run: go-test-coverage --config .testcoverage.yml

  # FOLLOW-UP (not blocking): diff/new-code coverage (>=85% on changed lines).
  # go-test-coverage supports it (`diff.threshold` + `diff.base-breakdown-file-name`)
  # but needs the BASE branch's coverage breakdown to compare against. Wiring it
  # cleanly means: (1) on push to master, run go-test-coverage with
  # `--breakdown-file-name` and persist that breakdown (its git storer commits it
  # to an orphan branch, or upload it as a workflow artifact keyed by branch);
  # (2) on PRs, restore that base breakdown and set `diff.base-breakdown-file-name`
  # so only changed code is graded at 85%. The per-package ratchet above already
  # blocks regressions on every touched package, so this is an enhancement, not a
  # gap that blocks the release.
