name: Pin Guard (supply-chain)

# CD-T1 keystone + CD-T2/T6/T7 drift guard. Modeled on the drift-guard grep
# block in windows-gate.yml. Four cheap, robust checks keep the supply-chain
# hardening honest on every push/PR:
#
#   1. CD-T1  every remote `uses:` must be pinned to a full 40-hex commit SHA.
#   2. CD-T2  no `@latest` ref may appear in any workflow (pin tool versions).
#   3. CD-T6  every workflow must declare a top-level `permissions:` block AND
#             that block must be READ-ONLY (least privilege), no `write-all`,
#             no top-level `: write` scope; writes are granted per-job.
#   4. CD-T7  every actions/upload-artifact step must set `retention-days:`.
#
# Self-reference: this file necessarily contains the tokens it searches for
# ("uses:", "@latest", "upload-artifact", and now "write-all"/": write"). The
# uses/retention checks anchor to a real YAML `uses:` key (optional "- " then
# `uses:` at line start) after stripping comments, so the grep/awk PROGRAM lines
# here (which have other leading text) never match. The @latest check excludes
# this file by name. The least-privilege check extracts ONLY the top-level
# `permissions:` block (up to the next column-0 key), so the `write-all`/`: write`
# tokens inside this job's `run:` program are never in scope.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pin-guard:
    name: Enforce pinning + least-privilege + retention
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # (1) CD-T1: every remote action ref must be a 40-hex commit SHA.
      #
      # NARROW EXCEPTION (CD-T5): the SLSA github-generator REUSABLE WORKFLOWS
      # (slsa-framework/slsa-github-generator/.github/workflows/*.yml) MUST be
      # referenced by an immutable `@vX.Y.Z` release tag, NOT a commit SHA:
      # slsa-verifier verifies the generator ran from that signed tag, and a
      # SHA ref (or a shorter @vX / @vX.Y tag) breaks builder-identity
      # verification. This is a documented, intentional slsa-github-generator
      # constraint. The ONE place SHA-pinning is not just discouraged but wrong.
      # Tag movement is caught by slsa-verifier + the Rekor transparency log, so
      # this is not a "mutable tag" hole. The exception is scoped to that exact
      # repo + workflows dir + a full 3-part semver tag; everything else (incl.
      # slsa-verifier's own installer action) must still be a 40-hex SHA.
      # (0) A workflow file GitHub will not even parse is worse than a failing
      #     job: no job is created, the run dies before any step, and the only
      #     message is "This run likely failed because of a workflow file issue".
      #
      #     This gate exists because that happened on 2026-09-06: a duplicated
      #     `shell:` key slipped into skillctl-windows-smoke.yml, GitHub rejected
      #     the file, and 14 runs failed across every branch for three and a half
      #     hours while nine PRs were merged. Nobody noticed, for two reasons
      #     worth writing down.
      #
      #     FIRST, the author validated with `yaml.safe_load`, which ACCEPTS
      #     duplicate keys and silently keeps the last one. The check reported
      #     "YAML OK" and could not have said anything else: it was the right
      #     tool answering a different question. Only a parser that REFUSES
      #     duplicates can see this class, which is why the one below refuses.
      #
      #     SECOND, the affected run is not a required check, so a red workflow
      #     blocked nothing. A gate nobody has to pass is a report.
      - name: "Guard: every workflow parses, with NO duplicate keys"
        run: |
          python3 - <<'PY'
          import glob, sys, yaml

          class Strict(yaml.SafeLoader):
              pass

          def no_duplicate_keys(loader, node, deep=False):
              seen, out = set(), {}
              for k, v in node.value:
                  key = loader.construct_object(k, deep=deep)
                  if key in seen:
                      raise ValueError(
                          f"duplicate key {key!r} at line {k.start_mark.line + 1}")
                  seen.add(key)
                  out[key] = loader.construct_object(v, deep=deep)
              return out

          Strict.add_constructor(
              yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG, no_duplicate_keys)

          bad = 0
          for f in sorted(glob.glob(".github/workflows/*.yml")):
              try:
                  yaml.load(open(f), Strict)
              except Exception as e:
                  print(f"FAIL {f}: {e}")
                  bad += 1
          if bad:
              print("")
              print("A duplicate key is silently accepted by most YAML readers and")
              print("rejected by GitHub. Fix the file; do not re-check with a loader")
              print("that tolerates it.")
              sys.exit(1)
          print("OK: every workflow parses and carries no duplicate key.")
          PY

      - name: "Guard: all `uses:` refs are pinned to a 40-hex SHA"
        run: |
          set -euo pipefail
          bad=""
          for f in .github/workflows/*.yml; do
            # Strip trailing comments, keep only real step/job-level `uses:` keys,
            # drop local (./) and docker:// refs, drop anything already pinned to
            # @<40 hex>, then drop the tag-pinned SLSA generator reusable workflow
            # (see NARROW EXCEPTION above). Whatever survives is an unpinned
            # violation.
            v="$(sed 's/#.*$//' "$f" \
                  | grep -nE '^[[:space:]]*(-[[:space:]]+)?uses:[[:space:]]' \
                  | grep -vE 'uses:[[:space:]]+(\.|docker://)' \
                  | grep -vE '@[0-9a-f]{40}[[:space:]]*$' \
                  | grep -vE 'uses:[[:space:]]+slsa-framework/slsa-github-generator/\.github/workflows/[A-Za-z0-9_.-]+\.yml@v[0-9]+\.[0-9]+\.[0-9]+[[:space:]]*$' || true)"
            if [ -n "$v" ]; then
              bad="$bad$(printf '%s\n' "$v" | sed "s|^|$f:|")"$'\n'
            fi
          done
          if [ -n "$bad" ]; then
            echo "::error::Unpinned action ref(s): pin to a full 40-char commit SHA (e.g. actions/checkout@<sha> # v7):"
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "OK: every 'uses:' ref is pinned to a 40-hex commit SHA."

      # (2) CD-T2: no floating @latest anywhere in the workflows.
      - name: "Guard: no @latest refs"
        run: |
          set -euo pipefail
          # Exclude this guard file: it contains the literal token by necessity.
          hits="$(grep -rnE '@latest' .github/workflows/ | grep -v 'pin-guard.yml' || true)"
          if [ -n "$hits" ]; then
            echo "::error::@latest ref(s) found: pin to a fixed version (CD-T2):"
            printf '%s\n' "$hits"
            exit 1
          fi
          echo "OK: no @latest refs."

      # (3) CD-T6: every workflow declares a top-level permissions block AND that
      # block is LEAST-PRIVILEGE: read-only. Presence alone is not enough: a
      # workflow with `permissions: write-all` (or `contents: write`) at the top
      # level would hand every job, including the one running third-party action
      # code, a write-scoped GITHUB_TOKEN. Writes MUST be granted per-job. This
      # check extracts ONLY the top-level block (the `^permissions:` line plus its
      # indented children, up to the next column-0 key) so legitimate PER-JOB
      # `permissions: { contents: write, id-token: write }` (indented under a job)
      # is never examined. Allowed top-level values: `read`, `none`, `{}`,
      # `read-all`. Rejected: `write-all` and any `: write` scope.
      - name: "Guard: top-level permissions present AND read-only (least privilege)"
        run: |
          set -euo pipefail
          bad=""
          for f in .github/workflows/*.yml; do
            if ! grep -qE '^permissions:' "$f"; then
              bad="$bad$f: missing a top-level 'permissions:' block"$'\n'
              continue
            fi
            # Extract the top-level permissions block only (stop at the next
            # column-0 YAML key like `env:`/`jobs:`), stripping trailing comments.
            block="$(awk '
              /^permissions:/ { inblk=1; print; next }
              inblk {
                if ($0 ~ /^[^[:space:]#]/) { inblk=0 }
                else print
              }
            ' "$f" | sed 's/#.*$//')"
            # (a) write-all at the top level is never allowed.
            if printf '%s\n' "$block" | grep -qE 'write-all'; then
              bad="$bad$f: top-level 'permissions: write-all' is forbidden: grant writes per-job"$'\n'
            fi
            # (b) any top-level write scope (contents: write, id-token: write, …).
            if printf '%s\n' "$block" | grep -qE ':[[:space:]]*write([[:space:]]|$)'; then
              bad="$bad$f: top-level permissions grants a write scope: move writes to a per-job 'permissions:' block"$'\n'
            fi
          done
          if [ -n "$bad" ]; then
            echo "::error::Top-level permissions must be present and read-only (CD-T6):"
            printf '%s' "$bad"
            exit 1
          fi
          echo "OK: every workflow declares a read-only top-level permissions block (writes are per-job)."

      # (4) CD-T7: every upload-artifact step sets retention-days.
      - name: "Guard: upload-artifact steps set retention-days"
        run: |
          set -euo pipefail
          bad=""
          for f in .github/workflows/*.yml; do
            # For each real `uses: …upload-artifact…` step key, scan its block
            # (until the next `- ` step item) for a retention-days: key.
            out="$(awk '
              /^[ \t]*(-[ \t]+)?uses:[ \t].*upload-artifact/ { inblk=1; has=0; ln=NR; next }
              inblk {
                if ($0 ~ /retention-days:/) has=1
                if ($0 ~ /^[ \t]*-[ \t]/) {
                  if (!has) print FILENAME ":" ln ": upload-artifact step missing retention-days"
                  inblk=0
                }
              }
              END { if (inblk && !has) print FILENAME ":" ln ": upload-artifact step missing retention-days" }
            ' "$f")"
            if [ -n "$out" ]; then bad="$bad$out"$'\n'; fi
          done
          if [ -n "$bad" ]; then
            echo "::error::upload-artifact step(s) without retention-days (CD-T7):"
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "OK: every upload-artifact step sets retention-days."

      # (5) CD-T8: a job that can be reached by a PULL REQUEST event and that
      # holds a REPOSITORY-WRITE token (`contents: write` or
      # `pull-requests: write`) must not run any `uses:` step.
      #
      # This gate exists because dependabot-auto-merge.yml states, in its own
      # header, that it "avoids the whole class by construction": no checkout, no
      # third-party action, so nothing from the pull request is ever executed
      # beside a write-scoped token. That sentence was prose. Measured on
      # 2026-09-08: a copy of that file with an `actions/checkout` of
      # `github.event.pull_request.head.sha` plus a `pip install -r` of the
      # bumped requirements passed all four checks above with exit 0, because a
      # poisoned checkout is perfectly SHA-pinned and perfectly least-privileged
      # at the top level. CD-T8 is what turns the header sentence into a claim
      # the tree enforces.
      #
      # Why `uses:` and not just `actions/checkout`: fetching the head ref is the
      # common way in, not the only one. Any third-party action in a
      # write-scoped, PR-triggered job runs code the pull request's author can
      # influence with a token that can push to the repository.
      #
      # SCOPE, stated so the number means something. Only jobs matching BOTH
      # conditions are examined. `security-events: write` (gosec.yml) and
      # `id-token: write` are NOT repository writes and are out of scope, which
      # is why the SARIF upload keeps its checkout. Jobs that inherit the
      # top-level block are covered by CD-T6, which already forces it read-only.
      - name: "Guard: no `uses:` in a write-scoped, PR-triggered job"
        run: |
          python3 - <<'PY'
          import glob, sys, yaml

          WRITE_SCOPES = ("contents", "pull-requests")
          PR_EVENTS = ("pull_request", "pull_request_target")

          def triggers(doc):
              # A bare `on:` is parsed as the boolean True by YAML 1.1.
              on = doc.get("on", doc.get(True))
              if isinstance(on, dict):
                  return list(on)
              if isinstance(on, list):
                  return list(on)
              return [on] if isinstance(on, str) else []

          def repo_write(perms):
              if perms == "write-all":
                  return True
              if not isinstance(perms, dict):
                  return False
              return any(perms.get(s) == "write" for s in WRITE_SCOPES)

          bad, examined = [], []
          for f in sorted(glob.glob(".github/workflows/*.yml")):
              doc = yaml.safe_load(open(f)) or {}
              if not any(e in triggers(doc) for e in PR_EVENTS):
                  continue
              for name, job in (doc.get("jobs") or {}).items():
                  if not isinstance(job, dict) or not repo_write(job.get("permissions")):
                      continue
                  examined.append(f"{f}:{name}")
                  for step in job.get("steps") or []:
                      if isinstance(step, dict) and step.get("uses"):
                          bad.append(f"{f}: job '{name}' step uses: {step['uses']}")

          if bad:
              print("::error::A write-scoped, PR-triggered job must not run any 'uses:' step (CD-T8):")
              for b in bad:
                  print(f"  {b}")
              print("")
              print("Such a job holds a token that can push to this repository, and a")
              print("pull request decides what the checked-out code contains. That is")
              print("poisoned pipeline execution. Drop the step, or drop the write scope.")
              sys.exit(1)
          print(f"OK: {len(examined)} PR-triggered job(s) hold a repository-write token, "
                f"and none runs a 'uses:' step.")
          for e in examined:
              print(f"  in scope: {e}")
          PY
