name: boundary-gate

# SPEC-0358 content-plane leak gate: fail if a public-plane file embeds
# private-plane content (private-repo paths, internal endpoints/secrets/context).
#
# The patterns live in tools/leak-patterns.txt and are shared with
# scripts/bugtracker.sh, which applies them to GitHub issue bodies. Text this
# gate can never see, because it is posted through the API rather than committed.
# Both sides' fixtures run here: a leak gate that silently stops flagging still
# reads green, so it is asserted from the failing side on every push.
#
# id-xref-lint enforces the other half of SPEC-0358: a public-plane reference into
# the private plane must be ID-ONLY ("implements SPEC-NNNN"), never a path or a
# document filename. Its resolution check needs the private registry, which public
# CI does not have, so here it runs FORMAT-ONLY and says so in its own output.
# That half is still worth gating: a glued `SPEC-NNNN-some-private-doc.md` leaks a
# private filename whether or not the id resolves. (Written with NNNN on purpose:
# a real four-digit id here would be the very violation this step rejects.)

on:
  # The push trigger is filtered to main and master, as every other required
  # gate in this tree already is. Measured on 2026-09-17 against the branch of
  # pull request #335: with an unfiltered `push:` this workflow produced 9
  # pull_request runs AND 9 push runs for the same nine commits, because a
  # branch push and the pull request on that branch are two events over one
  # tree. The pull_request run is the one that reports to the pull request, so
  # the push half was paid for and read by nobody.
  #
  # What this stops checking, said plainly: a push to a branch that has no pull
  # request open. Such a commit cannot reach master without a pull request, and
  # the gate runs on that pull request and on every push to master.
  push:
    branches: [main, master]
  pull_request:

# Concurrency: one run per ref, and a superseded pull-request run is cancelled.
# The group carries a LITERAL prefix rather than ${{ github.workflow }}, because
# inside a reusable workflow that context holds the CALLER's name: a group built
# from it can collide with the caller's own group, and a called workflow waiting
# on its caller never starts. A literal cannot do that, in any file.
#
# cancel-in-progress is conditional on purpose. A superseded pull-request run
# measures a commit nobody will merge, so cancelling it costs nothing. A run on
# main or master is the record for that commit, and cancelling it would leave a
# merged commit with no evidence that this gate ever passed on it.
concurrency:
  group: boundary-gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# CD-T6: least-privilege default GITHUB_TOKEN for the whole workflow.
permissions:
  contents: read

jobs:
  boundary-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # check-installer-version.sh liest `git tag --list 'skillctl/v*'`.
          # Ohne Tags faellt es mit exit 2 aus, also laut und nicht still, aber
          # ein rotes Tor aus einem fehlenden Fetch waere ein Fehlalarm.
          # Deshalb ausdruecklich, statt sich auf fetch-depth zu verlassen.
          fetch-tags: true
      - name: Run boundary-gate
        run: bash tools/boundary-gate.sh

      - name: boundary-gate fixtures (every pattern still blocks)
        run: bash tools/boundary-gate.test.sh

      - name: bugtracker fixtures (the post-gate refuses to publish a leak)
        run: bash scripts/bugtracker.test.sh

      - name: id-xref-lint (public->private references are id-only)
        run: bash tools/id-xref-lint.sh

      - name: id-xref-lint fixtures (including the registry-absent degrade)
        run: bash tools/id-xref-lint.test.sh

      # Lives here rather than in the prose gate because it needs the FULL
      # history: a pin is by definition an older commit, and a shallow clone
      # cannot tell a commit from a tag object. That distinction is the whole
      # check (BUG-0215).
      - name: install pins resolve to commits, digests match
        run: bash scripts/check-install-pins.sh

      # Die Gegenfrage zum Schritt darueber. Jener prueft, ob ein Pin AUFLOEST;
      # dieser, ob er die AKTUELLE Fassung ausliefert. Beim Schnitt von
      # skillctl/v0.5.0 war Ersteres richtig und Letzteres falsch, sechs Tage
      # lang, und der dokumentierte Einzeiler installierte v0.4.0.
      - name: installer default is the newest skillctl tag
        run: bash scripts/check-installer-version.sh
