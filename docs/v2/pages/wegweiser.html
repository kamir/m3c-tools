/* ══════════════════════════════════════════════════════════════════
   DRUCK-FLAVOR
   Ein Ausdruck kostet Toner dort, wo Flaechen gefuellt sind, nicht dort,
   wo Linien laufen. Deshalb faellt hier jede Flaeche weg: der dunkle
   Terminalgrund, die Tabellenkoepfe, der Achtung-Kasten, die Schiene.
   Was bleibt, sind Haarlinien und Text. Die Tokens tragen das, deshalb
   sind unten fast nur Farbwerte und vier bauliche Regeln.
   ══════════════════════════════════════════════════════════════════ */
@media print{
  :root, :root[data-theme="dark"], :root:not([data-theme="light"]){
    --bg:#ffffff; --surface:#ffffff; --surface-2:#ffffff;
    --ink:#000000; --ink-soft:#333a40; --line:#98a1a8; --line-soft:#c8ced3;
    --accent:#0b5553; --accent-soft:transparent;
    --warn:#7a4a0a; --warn-soft:transparent;
    --stop:#7d2020; --ok:#15543a;
    --term-bg:#ffffff; --term-fg:#000000; --term-dim:#4a555e; --term-line:#98a1a8;
  }
}
:root[data-flavor="druck"], :root[data-flavor="druck"][data-theme="dark"]{
  --bg:#ffffff; --surface:#ffffff; --surface-2:#ffffff;
  --ink:#000000; --ink-soft:#333a40; --line:#98a1a8; --line-soft:#c8ced3;
  --accent:#0b5553; --accent-soft:transparent;
  --warn:#7a4a0a; --warn-soft:transparent;
  --stop:#7d2020; --ok:#15543a;
  --term-bg:#ffffff; --term-fg:#000000; --term-dim:#4a555e; --term-line:#98a1a8;
}

/* Bauliches: gilt auf Papier und in der Druckansicht / Print view gleichermassen. */
@media print{
  .rail,.copy,.flavorbar{display:none !important}
  .shell{grid-template-columns:1fr}
  .doc{max-width:none; padding:0}
  .footnote{padding:14px 0 0; margin-top:26px}
}
:root[data-flavor="druck"] .rail{display:none}
:root[data-flavor="druck"] .shell{grid-template-columns:1fr}
:root[data-flavor="druck"] .doc{max-width:82ch}
:root[data-flavor="druck"] .copy{display:none}

/* Der Achtung-Kasten traegt im Druck eine Linie statt einer Flaeche. */
@media print{ .doc blockquote{border-left-width:2px; padding-left:14px} }
:root[data-flavor="druck"] .doc blockquote{border-left-width:2px; padding-left:14px}

/* Die Haken sind auf Papier zum Ausfuellen da, also echte Kaestchen. */
@media print{
  table.check input{appearance:none; -webkit-appearance:none; width:13px; height:13px;
    border:1.2px solid #000; border-radius:2px; background:#fff}
  table.check tr.done td:not(:first-child){opacity:1; text-decoration:none}
  table.check input:checked::after{content:"✓"; display:block; font-size:11px; line-height:11px; text-align:center}
}
:root[data-flavor="druck"] table.check input{appearance:none; -webkit-appearance:none;
  width:13px; height:13px; border:1.2px solid var(--ink); border-radius:2px; background:#fff}
:root[data-flavor="druck"] table.check input:checked::after{content:"✓"; display:block;
  font-size:11px; line-height:11px; text-align:center; color:var(--ink)}
:root[data-flavor="druck"] table.check tr.done td:not(:first-child){opacity:1; text-decoration:none}

/* Nur auf Papier: Satzspiegel, Schriftgrade und die Frage, wo getrennt wird. */
@page{margin:17mm 16mm}
@media print{
  body{font-size:10.4pt; line-height:1.48}
  .doc>h1:first-child{font-size:20pt}
  .doc h2{font-size:14pt; margin-top:26px; padding-top:12px; break-after:avoid}
  .doc h3{font-size:11.6pt; margin-top:18px; break-after:avoid}
  .doc>p:first-of-type{font-size:11pt}
  .doc table{font-size:9.3pt}
  .term pre{font-size:8.9pt; line-height:1.5; white-space:pre-wrap; word-break:break-word}
  .term,.tw,.doc blockquote,.doc table tr{break-inside:avoid}
  .doc a{color:var(--ink); border-bottom:0; text-decoration:underline}
  .term .strip{padding:3px 10px}
}

/* Die Umschaltleiste, nur am Schirm. */

<script id="src" type="text/markdown"># Wegweiser: Dokumentation nach Rollen

Sprachen / Languages: [Deutsch](index.md) | [English](index.en.md)

Diese Seite hilft bei der Auswahl der passenden Anleitung. Sie richtet sich an
Personen, die das Repository erstmals öffnen oder eine bestimmte Seite suchen.
Referenzen liegen unter `referenz/`, Anleitungen unter `nutzer/`, Betriebsanleitungen
unter `betrieb/`; Programm-, Dienst- und Komponentenindizes liegen unter `docs/`.

## Verbindliche Inhalte und Sprachfassungen

Deutsch und Englisch enthalten dieselben fachlichen Aussagen. Beide Fassungen
werden gemeinsam geprüft. Die implementierungsbezogenen Prüfungen lesen weiterhin
die bestehenden Originalpfade: docaudit, verbaudit, exitaudit, tutorial-smoke und
check-index. `check-doc-languages.py` prüft die Sprachpaare, ihre nach dem Review
gespeicherten Prüfsummen und identische Codebeispiele. Die Prüfsummen erkennen
nachträgliche Änderungen; sie beweisen keine korrekte Übersetzung.
`check-docpages` hält die erzeugten HTML-Seiten mit ihren Quellen synchron.

## Nach Rolle einsteigen

| Rolle | Gesuchter Inhalt | Einstieg |
|---|---|---|
| Nutzung | Installation, erste Aufnahme, Menüleisten-App und Tutorials | [Einstieg](nutzer/einstieg.de.md) |
| Entwicklung | Architektur, Pakete und Datenfluss | [Architekturübersicht](entwickler/architecture.de.md) |
| Entwicklung | Bauen, testen, Qualitätsprüfungen und Beiträge | [Entwicklungsumgebung](entwickler/getting-started.de.md) |
| Betrieb | Registry, Token, Sicherung, Monitoring und Vorfälle | [Betriebsübersicht](betrieb/ueberblick.de.md) |
| Sicherheit / CISO | Vertrauensmodell, Bedrohungen und Nachweise | [Sicherheitsübersicht](sicherheit/ueberblick.de.md) |

## Direktzugriffe

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"

<script>
(function () {
  var raw = document.getElementById('src').textContent;
  var doc = document.getElementById('doc');

  // ── Druck-Flavor ───────────────────────────────────────────────────
  // Zwei Wege zum selben Ergebnis: Cmd+P greift ueber @media print von
  // allein, der Knopf zeigt dasselbe vorher am Schirm. Die Wahl bleibt in
  // diesem Browser, und ein Speicher, der nicht da ist, aendert nichts.
  (function(){
    var bar = document.getElementById('flavorbar');
    var btn = document.getElementById('flavorbtn');
    var prt = document.getElementById('printbtn');
    var on = false;
    try { on = localStorage.getItem('hat-runbook-flavor') === 'druck'; } catch (e) {}

    function apply(){
      document.documentElement.setAttribute('data-flavor', on ? 'druck' : 'schirm');
      btn.setAttribute('aria-pressed', String(on));
      btn.querySelector('span').textContent = on ? 'Druckansicht an / Print view on' : 'Druckansicht / Print view';
    }
    btn.addEventListener('click', function(){
      on = !on;
      try { localStorage.setItem('hat-runbook-flavor', on ? 'druck' : 'schirm'); } catch (e) {}
      apply();
    });
    prt.addEventListener('click', function(){ window.print(); });
    apply();
    bar.hidden = false;
  })();

  // Faellt die Bibliothek aus, bleibt der Text lesbar. Eine leere Seite waere
  // die schlechtere Antwort auf ein 404.
  if (typeof marked === 'undefined') {
    var pre = document.createElement('pre');
    pre.style.whiteSpace = 'pre-wrap';
    pre.style.fontFamily = '"IBM Plex Mono", monospace';
    pre.style.fontSize = '13px';
    pre.textContent = raw;
    doc.appendChild(pre);
    return;
  }

  // ── Kopier-Knopf ───────────────────────────────────────────────────
  // Ein Block enthaelt oft Kommando UND Ausgabe. Wer auf "kopieren"
  // drueckt, will das Kommando, nicht das Protokoll. Beginnt eine Zeile
  // mit "$", wird nur sie genommen, samt ihrer Fortsetzungszeilen: eine
  // Zeile, die auf "\" endet, zieht die naechste mit.
  function commandOf(text){
    var lines = text.replace(/\s+$/,'').split('\n');
    var out = [], take = false;
    for (var i=0;i<lines.length;i++){
      var l = lines[i];
      if (/^\s*\$\s?/.test(l)){ out.push(l.replace(/^\s*\$\s?/,'')); take = /\\\s*$/.test(l); continue; }
      if (take){ out.push(l); take = /\\\s*$/.test(l); }
    }
