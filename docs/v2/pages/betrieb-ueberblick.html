<script id="src" type="text/markdown"># Ops-Ueberblick: der Betrieb und seine Runbooks

Welches Runbook in welcher Lage gilt, was die Runbooks gemeinsam voraussetzen,
und wo ihre Grenzen ausdruecklich benannt sind. Diese Seite fuehrt; die
Handgriffe selbst stehen in den verlinkten Runbooks und bleiben dort kanonisch.

Zielgruppe: die Person, die ein Registry oder eine Flotte betreibt, und die
Person, die ein Release schneidet. Wer ein Mensch-Agent-Team erst einrichtet,
beginnt nicht hier, sondern im
[Einrichtungs-Runbook](../../ops-human-agent-team.de.md).

Rolle: Betrieb · Sprache: DE · Stand: 2026-09-16

## Die Grundregel in einem Satz

**Ein "Gemessen"-Block gilt fuer das Binary, das Datum und die Umgebung, die
er nennt, und fuer nichts sonst:** die Ops-Runbooks dieses Repos kennzeichnen
jede gelaufene Messung als solche, und wer gegen ein anderes Release prueft,
prueft ein anderes Objekt.

## Wann welches Runbook

| Lage | Runbook | Sprache |
|---|---|---|
| Ein Team wird eingerichtet, der erste Skill wechselt die Maschine | [Ops-Runbook: Mensch-Agent-Team](../../ops-human-agent-team.de.md), auch als [Doku-Seite](../../pages/ops-human-agent-team.html) | DE |
| Wer besorgt welchen Token, wo liegt er, was passiert beim Ausscheiden | [Ops-Routine: Zugangstoken](../../ops-registry-tokens.de.md) | DE |
| Ein Schluessel oder das Registry ist kompromittiert | [Ops-Runbook: Incident Response](../../ops-incident-response.de.md) | DE |
| Sicherung und Wiederherstellung des Registrys, je Backend | [Ops-Runbook: Registry-Backup und Restore](../../ops-registry-backup-restore.de.md) | DE |
| Was ist heute beobachtbar, woran dockt eine Ueberwachung an | [Ops-Runbook: Monitoring und Alarmierung](../../ops-monitoring.de.md) | DE |
| Eine Maschine verhaelt sich falsch (Diagnose) | [Monitoring, Abschnitt 1](../../ops-monitoring.de.md#1-die-vier-kommandos-die-eine-überwachung-tragen): `skillctl doctor`, `auditlog status`, `pin status`; das `--home`-Kaveat steht unten | DE |
| Die Capture-Seite haengt: Upload fehlgeschlagen, Queue voll | [Ops-Runbook: m3c-tools-Capture](runbook-m3c-tools-capture.de.md) | DE |
| Ein Release wird geschnitten (beide Linien, tag-getrieben) | [Release flow](../../releasing.md) | EN |
| Zwei Personen weisen den Skill-Austausch ueber ER1 nach | [Runbook: two-person ER1 exchange](../../runbook-two-person-er1-exchange.md) | EN |
| Die volle Abnahme des Skill-Lebenszyklus (Bob und Alice) | [Acceptance & Handover](../../acceptance-skillctl-lifecycle.md) | EN |
| Ein frisches Zielgeraet wird aufgesetzt (Intel Mac, Windows) | [Setup & Operations](../../setup-target-devices.md) | EN |
| Ein frischer Install wird auf dem Zielgeraet validiert | [QA Acceptance Track](../../QA-target-device-setup.md) | EN |

Hinweis zu den letzten beiden Zeilen: beide Seiten sind auf **v2.10.0**
festgeschrieben, waehrend `git tag` in diesem Baum am 2026-09-16 bis
`v2.12.0` reicht. Die Vorgehensweise dort ist der kanonische Stand; die
Versionsnummer im Titel ist es nicht mehr.

## Datierte Entscheidungen, die den Betrieb binden

| Entscheidung | Quelle |
|---|---|
| Entschieden am 2026-09-06: produktiv ist die GitLab-Instanz `git.kieback-peter.de`, mit dem dort genannten Registry-Locator | [Ops-Routine: Zugangstoken](../../ops-registry-tokens.de.md), Kopfabschnitt |
| Schreibtoken gehoeren der Rolle Herausgeber, nicht einer Person; Personalwechsel rotiert das Token | [Ops-Routine: Zugangstoken](../../ops-registry-tokens.de.md) |
| Der Install-Einzeiler ist auf einen unveraenderlichen Commit gepinnt, nicht auf `master` | [Ops-Runbook: Mensch-Agent-Team, Abschnitt 0.2](../../ops-human-agent-team.de.md) |
| Releases sind tag-getrieben; es gibt keine VERSION-Datei, und die Produkt- und die skillctl-Linie werden getrennt geschnitten | [Release flow](../../releasing.md) |

## Was der Betrieb wissen muss, bevor etwas brennt

1. **Die drei Dateien, die Trust-Roots heissen.** Ein Pin traegt nur einen der
   Wege; die Falle und ihre Aufloesung stehen in
   [Ops-Runbook: Mensch-Agent-Team, Abschnitt 6](../../ops-human-agent-team.de.md).
2. **Exit-Codes sind das Alarm-Vokabular.** Die Runbooks verweisen auf die
   Fehlerbehandlung nach Exit-Code; das Register ist
   [CLI-VERBS](../../CLI-VERBS.md), die Tabelle je Kommando steht im
   [Manual: skillctl](../../manual-skillctl.md#exit-codes).
3. **`skillctl doctor --home` misst ein gemischtes Objekt.** Mit gesetztem
   `--home` prueft doctor skills-dir und audit-logs im Override, trust-roots
   und signing-key aber weiter im echten Home: im Code nimmt
   `checkTrustRoots()` keinen Override an, und `checkSigningKey` loest den
   Pfad ueber `defaultSelfKeyPath()` aus dem echten Home auf
   (`cmd/skillctl/doctor_cmds.go`, nachgelesen am 2026-09-16; so auch vom
   Operator-Review am selben Tag gemessen). Wer hermetisch messen will, darf
   sich auf `--home` allein nicht verlassen.
4. **Die Grenzen sind benannt.** Jedes der fuenf DE-Runbooks traegt einen
   eigenen Abschnitt darueber, was es ausdruecklich nicht loest
   (nachgesehen am 2026-09-16: "Was offen bleibt", "Was diese Routine nicht
   loest", "Was dieses Runbook nicht loest" zweimal, "Was damit ausdruecklich
   nicht geht"); wer den Umfang einschaetzen muss, liest zuerst diese
   Abschnitte.

    var prt = document.getElementById('printbtn');
    var on = false;
    try { on = localStorage.getItem('hat-runbook-flavor') === 'druck'; } catch (e) {}

    function apply(){
      document.documentElement.setAttribute('data-flavor', on ? 'druck' : 'schirm');
      btn.setAttribute('aria-pressed', String(on));
      btn.querySelector('span').textContent = on ? 'Druckansicht an' : 'Druckansicht';
    }
    btn.addEventListener('click', function(){
      on = !on;
      try { localStorage.setItem('hat-runbook-flavor', on ? 'druck' : 'schirm'); } catch (e) {}
      apply();
    });
    prt.addEventListener('click', function(){ window.print(); });
    apply();
    bar.hidden = false;
  })();

  // Faellt die Bibliothek aus, bleibt der Text lesbar. Eine leere Seite waere
  // die schlechtere Antwort auf ein 404.
  if (typeof marked === 'undefined') {
    var pre = document.createElement('pre');
    pre.style.whiteSpace = 'pre-wrap';
    pre.style.fontFamily = '"IBM Plex Mono", monospace';
    pre.style.fontSize = '13px';
    pre.textContent = raw;
    doc.appendChild(pre);
    return;
  }

  // ── Kopier-Knopf ───────────────────────────────────────────────────
  // Ein Block enthaelt oft Kommando UND Ausgabe. Wer auf "kopieren"
  // drueckt, will das Kommando, nicht das Protokoll. Beginnt eine Zeile
  // mit "$", wird nur sie genommen, samt ihrer Fortsetzungszeilen: eine
  // Zeile, die auf "\" endet, zieht die naechste mit.
  function commandOf(text){
    var lines = text.replace(/\s+$/,'').split('\n');
    var out = [], take = false;
    for (var i=0;i<lines.length;i++){
      var l = lines[i];
      if (/^\s*\$\s?/.test(l)){ out.push(l.replace(/^\s*\$\s?/,'')); take = /\\\s*$/.test(l); continue; }
      if (take){ out.push(l); take = /\\\s*$/.test(l); }
    }
    return out.length ? out.join('\n') : text.replace(/\s+$/,'');
  }

  var ICON_COPY = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">'
    + '<rect x="5.5" y="5.5" width="8.5" height="8.5" rx="1.6"/>'
    + '<path d="M10.5 3.2V2.8A0.8 0.8 0 0 0 9.7 2H2.8a0.8 0.8 0 0 0-0.8 0.8v6.9a0.8 0.8 0 0 0 0.8 0.8h0.4"/></svg>';
  var ICON_OK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">'
    + '<path d="M3 8.4l3.2 3.2L13 4.8"/></svg>';

  function writeClipboard(text){
    if (navigator.clipboard && navigator.clipboard.writeText){
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function(resolve, reject){
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly','');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      ok ? resolve() : reject(new Error('execCommand refused'));
    });
  }

  function addCopy(strip, pre, isRun){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'copy';
    var label = isRun ? 'Kommando' : 'kopieren';
    b.innerHTML = ICON_COPY + '<span>' + label + '</span>';
    b.setAttribute('aria-label', (isRun ? 'Kommando' : 'Block') + ' in die Zwischenablage kopieren');
    b.addEventListener('click', function(){
      var text = isRun ? commandOf(pre.textContent) : pre.textContent.replace(/\s+$/,'');
      writeClipboard(text).then(function(){
        b.dataset.state = 'ok';
        b.innerHTML = ICON_OK + '<span>kopiert</span>';
      }).catch(function(){
        // Klappt es nicht, wird der Text markiert: dann tut es Cmd+C.
        b.dataset.state = 'fail';
        b.innerHTML = ICON_COPY + '<span>markiert, Cmd+C</span>';
        var r = document.createRange();
        r.selectNodeContents(pre);
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(r);
      }).then(function(){
        setTimeout(function(){
          delete b.dataset.state;
          b.innerHTML = ICON_COPY + '<span>' + label + '</span>';
        }, 1900);
      });
    });
    strip.appendChild(b);
  }


  marked.setOptions({ gfm: true, breaks: false });
  doc.innerHTML = marked.parse(raw);

  // Anker wie auf GitHub, damit die Verweise im Dokument selbst greifen.
  function slug(t) {
    return t.toLowerCase().replace(/[^\p{L}\p{N}\s-]/gu, '').trim().replace(/\s+/g, '-');
  }
  var heads = doc.querySelectorAll('h2, h3');
  heads.forEach(function (h) { h.id = slug(h.textContent); });

  // Terminalbloecke: der Streifen sagt, was der Block ist.
  doc.querySelectorAll('pre').forEach(function (pre) {
    var box = document.createElement('div');
    box.className = 'term';
    var txt = pre.textContent;
    var label = /^\s*\$/m.test(txt) ? 'gelaufen' : (/^(skillctl|git|curl|irm|export|tools\/)/m.test(txt) ? 'kommando' : 'ausgabe');
    if (/^\s*\{/.test(txt)) label = 'json';
    if (/^##\s/m.test(txt)) label = 'vorlage';
    var strip = document.createElement('div');
    strip.className = 'strip';
    var tag = document.createElement('span');
    tag.textContent = label;
    strip.appendChild(tag);
    pre.parentNode.insertBefore(box, pre);
    box.appendChild(strip);
    box.appendChild(pre);
    addCopy(strip, pre, label === 'gelaufen');
  });

  // Tabellen duerfen seitlich scrollen, die Seite nie.
  doc.querySelectorAll('table').forEach(function (t) {
    var w = document.createElement('div');
    w.className = 'tw';
    t.parentNode.insertBefore(w, t);
    w.appendChild(t);
    var digits = t.querySelectorAll('td');
    digits.forEach(function (td) { if (/^\s*(V?\d+|Exit \d+)\s*$/.test(td.textContent)) td.style.fontVariantNumeric = 'tabular-nums'; });
  });

  // Die Abhakliste V1 bis V8 wird eine echte Liste. Der Stand bleibt nur in
  // diesem Browser, und ein Speicher, der nicht da ist, darf nichts kaputtmachen.
  var check = null;
  doc.querySelectorAll('table').forEach(function (t) {
    var first = t.querySelector('tbody td');
    if (first && /^V1$/.test(first.textContent.trim())) check = t;
  });
  if (check) {
    check.classList.add('check');
    var hr = check.querySelector('thead tr');
    var th = document.createElement('th');
    th.setAttribute('scope', 'col');
    var sr = document.createElement('span');
    sr.style.position = 'absolute';
    sr.style.left = '-9999px';
    sr.textContent = 'erledigt';
    th.appendChild(sr);
    hr.insertBefore(th, hr.firstChild);

    var rows = Array.prototype.slice.call(check.querySelectorAll('tbody tr'));
    var saved = {};
    try { saved = JSON.parse(localStorage.getItem('hat-runbook-checks') || '{}'); } catch (e) { saved = {}; }

    var prog = document.getElementById('progress');
    var pdone = document.getElementById('pdone');
    var ptotal = document.getElementById('ptotal');
    var pbar = document.getElementById('pbar');
    prog.hidden = false;
    ptotal.textContent = rows.length;

    function paint() {
      var n = rows.filter(function (r) { return r.classList.contains('done'); }).length;
      pdone.textContent = n;
      pbar.style.width = (n / rows.length * 100) + '%';
    }

    rows.forEach(function (r) {
      var key = r.querySelector('td').textContent.trim();
      var td = document.createElement('td');
      var box = document.createElement('input');
      box.type = 'checkbox';
      box.setAttribute('aria-label', key + ' erledigt');
      box.checked = !!saved[key];
      if (box.checked) r.classList.add('done');
      box.addEventListener('change', function () {
        r.classList.toggle('done', box.checked);
        saved[key] = box.checked;
        try { localStorage.setItem('hat-runbook-checks', JSON.stringify(saved)); } catch (e) { /* privates Fenster: dann eben nur diese Sitzung */ }
        paint();
      });
      td.appendChild(box);
      r.insertBefore(td, r.firstChild);
    });
    paint();
  }

  // Schiene aus den H2 bauen, Nummer getrennt vom Titel.
  var list = document.getElementById('navlist');
  var sections = [];
  doc.querySelectorAll('h2').forEach(function (h) {
    var t = h.textContent;
    if (/^(Inhalt)$/.test(t)) return;
    var m = t.match(/^(\d+)\.\s*(.*)$/);
    var li = document.createElement('li');
    var a = document.createElement('a');
    a.href = '#' + h.id;
    // Der Text kommt aus einer Ueberschrift und wird als TEXT gesetzt. Frueher
    // stand hier innerHTML: eine Ueberschrift mit einem "<" haette die Schiene
    // zerlegt, und CodeQL hat es als js/xss-through-dom gemeldet.
    var num = document.createElement('span');
    num.className = 'n';
    num.textContent = m ? m[1] : '\u00b7';
    var cap = document.createElement('span');
    cap.textContent = m ? m[2] : t;
    a.appendChild(num);
    a.appendChild(cap);
    li.appendChild(a);
    list.appendChild(li);
    sections.push({ h: h, a: a });
  });

  var obs = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting) return;
      sections.forEach(function (s) { s.a.classList.toggle('on', s.h === e.target); });
    });
  }, { rootMargin: '0px 0px -75% 0px', threshold: 0 });
  sections.forEach(function (s) { obs.observe(s.h); });

  // Auf schmalen Schirmen ist die Schiene zugeklappt.
  var nav = document.getElementById('nav');
  var toggle = document.getElementById('navtoggle');
  function narrow() { return window.matchMedia('(max-width: 900px)').matches; }
  function apply() { nav.hidden = narrow() && toggle.getAttribute('aria-expanded') === 'false'; }
  toggle.addEventListener('click', function () {
    var open = toggle.getAttribute('aria-expanded') === 'true';
    toggle.setAttribute('aria-expanded', String(!open));
    toggle.textContent = open ? 'Inhalt anzeigen' : 'Inhalt verbergen';
    apply();
  });
  window.addEventListener('resize', apply);
  apply();

  document.getElementById('foot').textContent =
    'Erzeugt aus docs/v2/betrieb/ueberblick.de.md mit tools/docpage.sh. Diese Seite rendert die Datei; ' +
    'massgeblich ist die Datei im Repository, nicht diese Fassung.';
})();
</script>
