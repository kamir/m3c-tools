<script id="src" type="text/markdown"># Guide: developer setup, build, test and the gates

How to get from a fresh clone to a passing local CI run, and which gates will
judge your change before a human does. Commands below were read from the
`Makefile` and `scripts/check-docs.sh` on 2026-09-16; run them from the
repository root of your own worktree.

Audience: a developer making their first change. The architecture itself is on
the [architecture overview](architecture.md); this page is about the workflow
around a change.

Rolle: Entwickler · Sprache: EN · Stand: 2026-09-16

## The core rule in one sentence

**Work in your own `git worktree`, on a branch named `<prefix>/<name>`, open
the pull request against `master`, and run `make ci` before you push:** the
shared checkout is worked by concurrent sessions, the branch name is enforced
by a required check, and CI runs the same gates you can run locally.

Branch prefixes, the reasoning and the one exception are in
[README, "Branch & worktree workflow"](../../../README.md#branch--worktree-workflow).
Two footnotes to that rule, both bitten in review:

- **The PR target is `master`.** `origin/main` exists but is not where work
  lands: measured on 2026-09-16, the recent pull requests (#307, #309, #311)
  are merge commits on `origin/master`, and `origin/master` is 554 commits
  ahead of `origin/main`'s merge base. Tooling that guesses "main" as the
  default guesses wrong here.
- **The worktree command.** The house target is
  `make worktree SPEC=spec-XXXX STEP=name BRANCH=feat/name [BASE=origin/master]`
  (creates `../wt/<SPEC>/<STEP>`; usage printed when arguments are missing).
  Plain git works too:

  ```bash
  git worktree add ../wt/my-change -b fix/my-change origin/master
  ```

## Part A: build

The two CLIs have different build prerequisites, and the lighter one first:

```bash
make build-skillctl     # the trust CLI; plain `go build`, no extra tools needed
make build              # main CLI -> ./build/m3c-tools; gated by check-deps (below)
make build-all          # every command in cmd/, a set the check-make-targets gate pins
make vet                # go vet ./...
```

**`make build` refuses on a machine without capture tooling.** The target
depends on `check-deps` (Makefile), which exits 1 unless `pkg-config`,
`ffmpeg` and `whisper` are all on PATH; `make deps` installs them. This gates
the main CLI even though the flagged tools are capture-runtime concerns; only
`build-skillctl` is free of it. `make build-all` additionally builds
`poc-recorder`, which imports PortAudio via cgo, so it needs
`brew install portaudio` on top. Platform details:
[Prerequisites](../../old/prerequisites.md).

## Part B: test

All tests live in `e2e/`. The suites are split by what they need; none of the
offline path needs a `.env` or any ER1 configuration:

```bash
make test-unit          # offline only: no network, no hardware
make test-network       # needs internet
make test-er1           # needs a running ER1 server
make test-whisper       # needs the whisper binary in PATH
make test-recorder      # needs PortAudio + a microphone
make e2e                # all of the above
```

`make test-unit` is a single long `go test` run, not instant: measured
2026-09-16 on one warm machine, `ok github.com/kamir/m3c-tools/e2e 39.601s`,
exit 0; `make ci` runs the same suite again as its test step.

A single offline test:
`go test -v -count=1 ./e2e/ -run TestRetryQueueInsertAndQuery` (part of the
`test-unit` selection). Careful when picking your own `-run` pattern: some
`e2e/` tests are network tests, and not every one guards itself with
`SkipIfNoYTCalls` (`TestTranscriptFetch` in `e2e/transcript_test.go` calls
YouTube unguarded). And note the trap recorded in
`.claude/rules/claims.md`: a `-run` pattern matching nothing exits 0;
`scripts/require-tests-ran.sh` exists for exactly that.

## Part C: the gates, and which files they bind

`make ci` runs, in this order (read from the Makefile target `ci`):
`vet lint check-emdash check-gofmt check-redirect-guard check-required-checks
check-docpages test-unit build`.

**One tool it does not install for you: `golangci-lint`.** The `lint` step
calls `golangci-lint run` directly (Makefile), so on a machine without it,
`make ci` stops at step two. The stage 2 script
(`scripts/skillctl-enterprise-test.sh`, described in
[Prerequisites](../../old/prerequisites.md)) installs it at the version CI pins;
installing by hand works too, the enforced config is `.golangci.yml`.

The documentation gates live in `./scripts/check-docs.sh` and block a release:

| Gate | Binary | Binds |
|---|---|---|
| CLI ↔ manual ↔ `--help` | `cmd/docaudit` | [manual-m3c-tools](../referenz/manual-m3c-tools.md), [manual-skillctl](../referenz/manual-skillctl.md), exemptions in [docaudit-ignore.txt](../../docaudit-ignore.txt) |
| verb register | `cmd/verbaudit` | [CLI-VERBS](../referenz/CLI-VERBS.md): register the verb BEFORE implementing it |
| exit-code register | `cmd/exitaudit` | the manual's `Exit:` lines, the register column, `pkg/skillctl/exitcode` |
| tutorial chain | `scripts/tutorial-smoke.sh` | `docs/v2/nutzer/tutorial-szenario-0*.de.md`, run against a throwaway registry (a bare `local://` git registry in a temporary HOME, created and deleted per run) |
| index freshness | `scripts/check-index.sh` | [program-index](../../program-index.md), [component-index](../../component-index.md), both directions plus the counts |
| docpage drift | `scripts/check-docpages.sh` | every page registered in its `REGISTER` block, byte-compared against its markdown source |

Two prose rules are binding for every byte you write into this tree, including
commit messages: [prose-style.md](../../../.claude/rules/prose-style.md)
(never U+2014, machine-enforced) and
[claims.md](../../../.claude/rules/claims.md) (the word "measured" is reserved
for what was measured).

Formatting and commit conventions beyond `gofmt` (gofumpt, `gci` import
groups, the `-race` test policy) are in
[CONTRIBUTING.md](../../../CONTRIBUTING.md); `.golangci.yml` is the enforced
config, and [CODESTYLE.md](../../../CODESTYLE.md) carries the reasoning.

## Part D: filing bugs and features

A bug or feature request lives on two planes, kept in step by
`scripts/bugtracker.sh`; the workflow, the refusals and the redaction rules
are in [bug-tracking](bug-tracking.md).

## Part E: releasing

Releases are tag-driven; there is no VERSION file, and the product line
(`vX.Y.Z`) and the skillctl line (`skillctl/vX.Y.Z`) are cut independently.
The operational runbook is [releasing](../betrieb/releasing.md); the human
sign-off and acceptance gates are described there too.

<script>
(function () {
  var raw = document.getElementById('src').textContent;
  var doc = document.getElementById('doc');

  // ── Druck-Flavor ───────────────────────────────────────────────────
  // Zwei Wege zum selben Ergebnis: Cmd+P greift ueber @media print von
  // allein, der Knopf zeigt dasselbe vorher am Schirm. Die Wahl bleibt in
  // diesem Browser, und ein Speicher, der nicht da ist, aendert nichts.
  (function(){
    var bar = document.getElementById('flavorbar');
    var btn = document.getElementById('flavorbtn');
    var prt = document.getElementById('printbtn');
    var on = false;
    try { on = localStorage.getItem('hat-runbook-flavor') === 'druck'; } catch (e) {}

    function apply(){
      document.documentElement.setAttribute('data-flavor', on ? 'druck' : 'schirm');
      btn.setAttribute('aria-pressed', String(on));
      btn.querySelector('span').textContent = on ? 'Druckansicht an' : 'Druckansicht';
    }
    btn.addEventListener('click', function(){
      on = !on;
      try { localStorage.setItem('hat-runbook-flavor', on ? 'druck' : 'schirm'); } catch (e) {}
      apply();
    });
    prt.addEventListener('click', function(){ window.print(); });
    apply();
    bar.hidden = false;
  })();

  // Faellt die Bibliothek aus, bleibt der Text lesbar. Eine leere Seite waere
  // die schlechtere Antwort auf ein 404.
  if (typeof marked === 'undefined') {
    var pre = document.createElement('pre');
    pre.style.whiteSpace = 'pre-wrap';
    pre.style.fontFamily = '"IBM Plex Mono", monospace';
    pre.style.fontSize = '13px';
    pre.textContent = raw;
    doc.appendChild(pre);
    return;
  }

  // ── Kopier-Knopf ───────────────────────────────────────────────────
  // Ein Block enthaelt oft Kommando UND Ausgabe. Wer auf "kopieren"
  // drueckt, will das Kommando, nicht das Protokoll. Beginnt eine Zeile
  // mit "$", wird nur sie genommen, samt ihrer Fortsetzungszeilen: eine
  // Zeile, die auf "\" endet, zieht die naechste mit.
  function commandOf(text){
    var lines = text.replace(/\s+$/,'').split('\n');
    var out = [], take = false;
    for (var i=0;i<lines.length;i++){
      var l = lines[i];
      if (/^\s*\$\s?/.test(l)){ out.push(l.replace(/^\s*\$\s?/,'')); take = /\\\s*$/.test(l); continue; }
      if (take){ out.push(l); take = /\\\s*$/.test(l); }
    }
    return out.length ? out.join('\n') : text.replace(/\s+$/,'');
  }

  var ICON_COPY = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">'
    + '<rect x="5.5" y="5.5" width="8.5" height="8.5" rx="1.6"/>'
    + '<path d="M10.5 3.2V2.8A0.8 0.8 0 0 0 9.7 2H2.8a0.8 0.8 0 0 0-0.8 0.8v6.9a0.8 0.8 0 0 0 0.8 0.8h0.4"/></svg>';
  var ICON_OK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">'
    + '<path d="M3 8.4l3.2 3.2L13 4.8"/></svg>';

  function writeClipboard(text){
    if (navigator.clipboard && navigator.clipboard.writeText){
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function(resolve, reject){
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly','');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      ok ? resolve() : reject(new Error('execCommand refused'));
    });
  }

  function addCopy(strip, pre, isRun){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'copy';
    var label = isRun ? 'Kommando' : 'kopieren';
    b.innerHTML = ICON_COPY + '<span>' + label + '</span>';
    b.setAttribute('aria-label', (isRun ? 'Kommando' : 'Block') + ' in die Zwischenablage kopieren');
    b.addEventListener('click', function(){
      var text = isRun ? commandOf(pre.textContent) : pre.textContent.replace(/\s+$/,'');
      writeClipboard(text).then(function(){
        b.dataset.state = 'ok';
        b.innerHTML = ICON_OK + '<span>kopiert</span>';
      }).catch(function(){
        // Klappt es nicht, wird der Text markiert: dann tut es Cmd+C.
        b.dataset.state = 'fail';
        b.innerHTML = ICON_COPY + '<span>markiert, Cmd+C</span>';
        var r = document.createRange();
        r.selectNodeContents(pre);
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(r);
      }).then(function(){
        setTimeout(function(){
          delete b.dataset.state;
          b.innerHTML = ICON_COPY + '<span>' + label + '</span>';
        }, 1900);
      });
    });
    strip.appendChild(b);
  }


  marked.setOptions({ gfm: true, breaks: false });
  doc.innerHTML = marked.parse(raw);

  // Anker wie auf GitHub, damit die Verweise im Dokument selbst greifen.
  function slug(t) {
    return t.toLowerCase().replace(/[^\p{L}\p{N}\s-]/gu, '').trim().replace(/\s+/g, '-');
  }
  var heads = doc.querySelectorAll('h2, h3');
  heads.forEach(function (h) { h.id = slug(h.textContent); });

  // Terminalbloecke: der Streifen sagt, was der Block ist.
  doc.querySelectorAll('pre').forEach(function (pre) {
    var box = document.createElement('div');
    box.className = 'term';
    var txt = pre.textContent;
    var label = /^\s*\$/m.test(txt) ? 'gelaufen' : (/^(skillctl|git|curl|irm|export|tools\/)/m.test(txt) ? 'kommando' : 'ausgabe');
    if (/^\s*\{/.test(txt)) label = 'json';
    if (/^##\s/m.test(txt)) label = 'vorlage';
    var strip = document.createElement('div');
    strip.className = 'strip';
    var tag = document.createElement('span');
    tag.textContent = label;
    strip.appendChild(tag);
    pre.parentNode.insertBefore(box, pre);
    box.appendChild(strip);
    box.appendChild(pre);
    addCopy(strip, pre, label === 'gelaufen');
  });

  // Tabellen duerfen seitlich scrollen, die Seite nie.
  doc.querySelectorAll('table').forEach(function (t) {
    var w = document.createElement('div');
    w.className = 'tw';
    t.parentNode.insertBefore(w, t);
    w.appendChild(t);
    var digits = t.querySelectorAll('td');
    digits.forEach(function (td) { if (/^\s*(V?\d+|Exit \d+)\s*$/.test(td.textContent)) td.style.fontVariantNumeric = 'tabular-nums'; });
  });

  // Die Abhakliste V1 bis V8 wird eine echte Liste. Der Stand bleibt nur in
  // diesem Browser, und ein Speicher, der nicht da ist, darf nichts kaputtmachen.
  var check = null;
  doc.querySelectorAll('table').forEach(function (t) {
    var first = t.querySelector('tbody td');
    if (first && /^V1$/.test(first.textContent.trim())) check = t;
  });
  if (check) {
    check.classList.add('check');
    var hr = check.querySelector('thead tr');
    var th = document.createElement('th');
    th.setAttribute('scope', 'col');
    var sr = document.createElement('span');
    sr.style.position = 'absolute';
    sr.style.left = '-9999px';
    sr.textContent = 'erledigt';
    th.appendChild(sr);
    hr.insertBefore(th, hr.firstChild);

    var rows = Array.prototype.slice.call(check.querySelectorAll('tbody tr'));
    var saved = {};
    try { saved = JSON.parse(localStorage.getItem('hat-runbook-checks') || '{}'); } catch (e) { saved = {}; }

    var prog = document.getElementById('progress');
    var pdone = document.getElementById('pdone');
    var ptotal = document.getElementById('ptotal');
    var pbar = document.getElementById('pbar');
    prog.hidden = false;
    ptotal.textContent = rows.length;

    function paint() {
      var n = rows.filter(function (r) { return r.classList.contains('done'); }).length;
      pdone.textContent = n;
      pbar.style.width = (n / rows.length * 100) + '%';
    }

    rows.forEach(function (r) {
      var key = r.querySelector('td').textContent.trim();
      var td = document.createElement('td');
      var box = document.createElement('input');
      box.type = 'checkbox';
      box.setAttribute('aria-label', key + ' erledigt');
      box.checked = !!saved[key];
      if (box.checked) r.classList.add('done');
      box.addEventListener('change', function () {
        r.classList.toggle('done', box.checked);
        saved[key] = box.checked;
        try { localStorage.setItem('hat-runbook-checks', JSON.stringify(saved)); } catch (e) { /* privates Fenster: dann eben nur diese Sitzung */ }
        paint();
      });
      td.appendChild(box);
      r.insertBefore(td, r.firstChild);
    });
    paint();
  }

  // Schiene aus den H2 bauen, Nummer getrennt vom Titel.
  var list = document.getElementById('navlist');
  var sections = [];
  doc.querySelectorAll('h2').forEach(function (h) {
    var t = h.textContent;
    if (/^(Inhalt)$/.test(t)) return;
    var m = t.match(/^(\d+)\.\s*(.*)$/);
    var li = document.createElement('li');
    var a = document.createElement('a');
    a.href = '#' + h.id;
    // Der Text kommt aus einer Ueberschrift und wird als TEXT gesetzt. Frueher
    // stand hier innerHTML: eine Ueberschrift mit einem "<" haette die Schiene
    // zerlegt, und CodeQL hat es als js/xss-through-dom gemeldet.
    var num = document.createElement('span');
    num.className = 'n';
    num.textContent = m ? m[1] : '\u00b7';
    var cap = document.createElement('span');
    cap.textContent = m ? m[2] : t;
    a.appendChild(num);
    a.appendChild(cap);
    li.appendChild(a);
    list.appendChild(li);
    sections.push({ h: h, a: a });
  });

  var obs = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting) return;
      sections.forEach(function (s) { s.a.classList.toggle('on', s.h === e.target); });
    });
  }, { rootMargin: '0px 0px -75% 0px', threshold: 0 });
  sections.forEach(function (s) { obs.observe(s.h); });

  // Auf schmalen Schirmen ist die Schiene zugeklappt.
  var nav = document.getElementById('nav');
  var toggle = document.getElementById('navtoggle');
  function narrow() { return window.matchMedia('(max-width: 900px)').matches; }
  function apply() { nav.hidden = narrow() && toggle.getAttribute('aria-expanded') === 'false'; }
  toggle.addEventListener('click', function () {
    var open = toggle.getAttribute('aria-expanded') === 'true';
    toggle.setAttribute('aria-expanded', String(!open));
    toggle.textContent = open ? 'Inhalt anzeigen' : 'Inhalt verbergen';
    apply();
  });
  window.addEventListener('resize', apply);
  apply();

  document.getElementById('foot').textContent =
    'Erzeugt aus docs/v2/entwickler/getting-started.md mit tools/docpage.sh. Diese Seite rendert die Datei; ' +
    'massgeblich ist die Datei im Repository, nicht diese Fassung.';
})();
</script>
