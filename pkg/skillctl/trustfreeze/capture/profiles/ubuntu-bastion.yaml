# Trust Freeze built-in profile. Probe list from SPEC-0467 section 5.6
# (SPEC-0471 TF06-R3). The linux probes are implemented; the probe id of the
# SSH probe is linux.ssh, because it collects the declared configuration and
# the effective state of sshd in one result. The common.* probes below do not
# exist in this build and are recorded as unsupported (not_implemented), so a
# capture with this profile is honestly incomplete until they arrive.
#
# Version 3 adds linux.executables, linux.network.routes and linux.dns, which
# completes the required list of SPEC-0471 TF06-R3: the programs a service
# names with their hash, where this host sends traffic, and which resolver
# answers for it. A host that was complete against version 2 is incomplete
# against version 3 until the three new probes have run. That is arithmetic,
# not a regression: a wider question cannot make an older answer more
# complete.
#
# On an unprivileged host linux.firewall is permission_denied (nft and ufw
# both refuse without root) and linux.ssh records the declared state only, so
# a capture there is incomplete. That is the correct answer, not a defect.
schema_version: trust-freeze/profile/v1
id: ubuntu-bastion
version: "3"
description: Ubuntu bastion host (packages, users, sudo, ssh, systemd, executables, listeners, routes, dns, firewall, mounts, containers).
required:
  - common.identity
  - linux.packages
  - linux.users
  - linux.sudo
  - linux.ssh
  - linux.systemd
  - linux.executables
  - linux.network.listeners
  - linux.network.routes
  - linux.dns
  - linux.firewall
  - linux.mounts
optional:
  - common.git
  - common.claude
  - linux.containers
fail_if_required_missing: true
redaction_policy: default-v1
